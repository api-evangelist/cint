aid: cint
name: Cint
description: >-
  Cint is the world's largest global research marketplace, connecting researchers,
  brands, and agencies with millions of survey respondents across 130+ countries.
  The Cint Exchange Demand API is a REST API for buying market-research sample
  programmatically: create projects and target groups, run feasibility, launch and
  manage fielding runs, handle respondent exclusions and recontacts, reconcile
  completed interviews, and receive event notifications via webhooks. Cint also
  operates Lucid Measurement (ad-campaign brand lift) and Cint Engage (audience
  monetization). Surfaced as a Creandum portfolio company and enriched from Cint's
  public developer portal.
url: https://raw.githubusercontent.com/api-evangelist/cint/refs/heads/main/apis.yml
x-type: company
x-source: vc-portfolio
x-backed-by:
- creandum
x-tier: enriched
