    ModuleDynamicPricing:
      title: Dynamic pricing
      type: object
      description: 'Controls the Cost Per Interview (CPI) to achieve a 100% fill rate by the target group''s end date as cost-effectively as possible.


        Key behaviors:


        * **Prerequisite:** This module can only be used for target groups configured with dynamic pricing.

        * You must specify either `total_budget` or `maximum_cpi`, but not both.

        * If you specify `minimum_cpi`, it must be lower than the `maximum_cpi`.

        * The `total_budget` setting can overrule the `minimum_cpi`.

        '
      properties:
        type:
          type: string
          enum:
          - dynamic
          description: The type of module. For this object, the value is always 'dynamic'.
        total_budget:
          description: The maximum total amount to spend for the target number of completes.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        maximum_cpi:
          description: The maximum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        minimum_cpi:
          description: The minimum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
      required:
      - type
    TargetGroupRespondentActivityExclusionsRequest:
      type: array
      description: The list of target groups and projects whose respondents should be excluded from this target group's survey.
      items:
        $ref: '#/components/schemas/RespondentActivityExclusionsIDsListRequest'
    LocaleCode:
      type: string
      description: Unique text code of the locale.
      example: eng_us
    FillingStrategyUpdateResponse:
      type: object
      description: Response for filling strategy update.
      required:
      - filling_strategy
      properties:
        filling_strategy:
          $ref: '#/components/schemas/FillingStrategy'
    TargetGroupDetailsUpdateRequest:
      type: object
      description: The Target Group update request.
      required:
      - name
      - project_manager_id
      - expected_length_of_interview_minutes
      - expected_incidence_rate
      - live_url
      - test_url
      - industry_lockout_code
      properties:
        name:
          $ref: '#/components/schemas/TargetGroupName'
        project_manager_id:
          $ref: '#/components/schemas/UserID'
        expected_length_of_interview_minutes:
          $ref: '#/components/schemas/TargetGroupExpectedLengthOfInterview'
        expected_incidence_rate:
          $ref: '#/components/schemas/TargetGroupExpectedIncidenceRate'
        industry_lockout_code:
          $ref: '#/components/schemas/TargetGroupIndustryLockoutCode'
        live_url:
          $ref: '#/components/schemas/TargetGroupLiveUrl'
        test_url:
          $ref: '#/components/schemas/TargetGroupTestUrl'
        target_group_customer_reference_number:
          allOf:
          - $ref: '#/components/schemas/TargetGroupCustomerReferenceNumber'
          - nullable: true
        client_cost_per_interview_note:
          $ref: '#/components/schemas/TargetGroupClientCpiMonetaryAmountRequestModel'
    DropOffRate:
      type: number
      format: float
      description: Current drop-off rate of the Target Group.
      minimum: 0
      maximum: 1
      example: 0.05
    PacingStrategy:
      description: The pacing strategy.
      type: string
      enum:
      - linear
      - adaptive
      - gemini
      example: linear
    FieldingRunEndAt:
      type: string
      format: date-time
      description: 'The timestamp the fielding run is scheduled to end at (RFC3339 UTC format, 3 fractional digits).  The end time has to be after the starting time. '
      example: '2023-01-01T23:00:00.000Z'
    TargetGroupOverviewByTargetGroupId:
      type: object
      description: Basic attributes and statistics of a Target Group.
      required:
      - account_id
      - project_id
      - project_name
      - target_group_name
      - project_manager_id
      - progress
      - pricing_model
      - is_pricing_restricted
      - current_cost_per_interview
      - current_cost
      - status
      - country_code
      - language_code
      - conversion_rate
      - drop_off_rate
      - incidence_rate
      - median_length_of_interview_seconds
      - created_at
      properties:
        account_id:
          $ref: '#/components/schemas/AccountID'
        project_id:
          $ref: '#/components/schemas/ProjectID'
        project_name:
          type: string
          description: Name of the Project which contains the Target Group.
          example: Example Project
        target_group_name:
          type: string
          description: Name of the Target Group.
          example: Example Target Group
        human_readable_id:
          $ref: '#/components/schemas/TargetGroupHumanReadableID'
        project_manager_id:
          $ref: '#/components/schemas/UserID'
        progress:
          $ref: '#/components/schemas/TargetGroupProgress'
        pricing_model:
          $ref: '#/components/schemas/TargetGroupPricingModel'
        is_pricing_restricted:
          type: boolean
          description: True when there are target group CPI restrictions in place from fielding assistant, otherwise false.
          example: true
        current_cost_per_interview:
          description: Currently active Cost per Interview for the Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        average_cost_per_interview:
          description: Average Cost per Interview for the Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        current_cost:
          description: The total cost of the completes collected so far in this Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        status:
          $ref: '#/components/schemas/TargetGroupStatus'
        country_code:
          type: string
          description: String representing country code.
          example: US
        language_code:
          type: string
          description: String representing language code.
          example: ENG
        conversion_rate:
          $ref: '#/components/schemas/ConversionRate'
        drop_off_rate:
          $ref: '#/components/schemas/DropOffRate'
        incidence_rate:
          $ref: '#/components/schemas/IncidenceRate'
        median_length_of_interview_seconds:
          $ref: '#/components/schemas/MedianLengthOfInterviewSeconds'
        study_type_code:
          $ref: '#/components/schemas/StudyTypeCode'
        target_group_customer_reference_number:
          allOf:
          - $ref: '#/components/schemas/TargetGroupCustomerReferenceNumber'
          - nullable: true
        created_at:
          type: string
          format: date-time
          description: Date and time when the target group was created (RFC3339 UTC format, 3 fractional digits).
          example: '2023-01-01T23:00:00.000Z'
    ProjectID:
      description: The character string representing a unique project ID (ULID format).
      type: string
      pattern: ^[0-9A-Z]{26}$
      example: 01BTGNYV6HRNK8K8VKZASZCFP0
    ModuleLinearPacing:
      title: Linear even pacing
      type: object
      description: Paces fielding by incrementing the completes goal in regular intervals until the target group's end date.
      properties:
        type:
          type: string
          enum:
          - linear
          description: The type of module. For this object, the value is always 'linear'.
        increment_interval:
          $ref: '#/components/schemas/IncrementInterval'
      required:
      - type
      - increment_interval
    ProfileTargetsResponseOpenEndedConditionsV3:
      oneOf:
      - title: Allow All Values
        description: If `allow_all_values` is true, `open_ended_values` must be null.
        type: object
        properties:
          object:
            type: string
            description: Object field to distinguish between different types of control selections.  Always is `open_ended`.
            enum:
            - open_ended
            example: open_ended
          question_id:
            $ref: '#/components/schemas/QuestionID'
          allow_all_values:
            type: boolean
            enum:
            - true
            description: Flag to allow all values.
          open_ended_values:
            type: array
            minItems: 0
            maxItems: 0
            items:
              type: string
            nullable: true
            description: Must be null when `allow_all_values` is true.
          condition_name:
            type: string
            description: The name of the condition. This field will be present if the condition is part of a blended or grouped target.
            example: Open Ended 1
          condition_name_translated:
            type: string
            description: The name of the condition translated (when appropriate and available). This field will be present if the condition is part of a blended or grouped target.
            example: Open Ended 1
        required:
        - object
        - question_id
        - allow_all_values
        - open_ended_values
      - title: Specific Open End Values
        description: If `allow_all_values` is false, `open_ended_values` must contain at least one open end value.
        type: object
        properties:
          object:
            type: string
            description: Object field to distinguish between different types of control selections.  Always is `open_ended`.
            enum:
            - open_ended
            example: open_ended
          question_id:
            $ref: '#/components/schemas/QuestionID'
          allow_all_values:
            type: boolean
            enum:
            - false
            description: Flag to allow only specific open end values.
          open_ended_values:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 10000
            description: List of applicable open end values. Required when `allow_all_values` is false. Note that only 10,000 values may be provided. For more than 10,000, please reach out to your integration consultant.
          condition_name:
            type: string
            description: The name of the condition. This field will be present if the condition is part of a blended or grouped target.
            example: Open Ended 1
          condition_name_translated:
            type: string
            description: The name of the condition translated (when appropriate and available). This field will be present if the condition is part of a blended or grouped target.
            example: Open Ended 1
        required:
        - object
        - question_id
        - allow_all_values
        - open_ended_values
      example:
        object: open_ended
        question_id: 45
        open_ended_values: []
        allow_all_values: true
        condition_name: Open Ended Values
        condition_name_translated: Open Ended Values Translated
    ExclusionEntityID:
