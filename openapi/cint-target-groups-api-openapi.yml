      required:
      - country_code
      - bound_rate_card_token
      - bound_rate_card
      properties:
        country_code:
          type: string
          description: String representing the country code.
          example: US
        bound_rate_card_token:
          type: string
          description: Rate card token.
          example: UkNUPUNPVU5UUlk6UkNWPTE2OkNDPVVT
        bound_rate_card:
          $ref: '#/components/schemas/RateCardData'
