      properties:
        target_groups:
          $ref: '#/components/schemas/TargetGroupIds'
        is_launch_allowed:
          type: boolean
        is_pause_allowed:
          type: boolean
        is_resume_allowed:
          type: boolean
        is_relaunch_allowed:
          type: boolean
        is_finish_allowed:
          type: boolean
    ModuleGeminiPacing:
      title: Gemini pacing
      type: object
      description: Always collects at most as many completes on each quota, as were collected on an exposed target group. Intended for Measurement control target groups.
      properties:
        type:
          type: string
          enum:
          - gemini
          description: The type of module. For this object, the value is always 'gemini'.
        exposed_target_group_id:
          type: string
          format: ulid
          description: Uniquely identifies exposed target group by ID.
          example: 01HC2Z6TM8C4F3Y5CA6S2JR475
      required:
      - type
      - exposed_target_group_id
    TargetGroupPerformance:
      type: object
      description: Display key statistics about performance of a target group.
      required:
      - entrants
      - prescreens
      - completes
      properties:
        entrants:
          type: integer
          description: Number of entrants.
          example: 100
        prescreens:
          type: integer
          description: Number of prescreens.
          example: 100
        completes:
          type: integer
          description: Number of completes.
          example: 100
        completes_cost:
          $ref: '#/components/schemas/MonetaryAmount'
        first_complete:
          type: string
          format: date-time
          description: First complete date.
          example: '2023-01-01T23:00:00.000Z'
        last_complete:
          type: string
          format: date-time
          description: Last complete date.
          example: '2023-01-01T23:00:00.000Z'
        incidence_rate:
          $ref: '#/components/schemas/IncidenceRate'
        drop_off_rate:
          $ref: '#/components/schemas/DropOffRate'
        conversion_rate:
          $ref: '#/components/schemas/ConversionRate'
        respondent_analysis:
          type: object
          description: Respondent analysis grouped status codes and counts.
          properties:
            live:
              type: array
              items:
                $ref: '#/components/schemas/RespondentAnalysisStatusCodes'
            test:
              type: array
              items:
                $ref: '#/components/schemas/RespondentAnalysisStatusCodes'
    CreatedDraftTargetGroupResponse:
      type: object
      description: Response for creating draft target Group.
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/TargetGroupID'
    PricingAssistance:
      description: Assist the pricing of the target group.
      type: string
      enum:
      - dynamic
      example: dynamic
    LastCompleteDate:
      type: string
      format: date-time
      description: The timestamp the Target Groups latest complete was received (RFC3339 UTC format, 3 fractional digits).
      example: '2023-01-01T23:00:00.000Z'
    RespondentAnalysisStatusCodes:
      type: object
      description: Respondent analysis grouped status codes and counts.
      properties:
        status:
          type: string
          description: Status code.
          example: Complete, Terminate, In Survey, Overquota
        label:
          type: string
          description: Label of status code.
          example: Returned as Complete
        description:
          type: string
          description: Description of status code.
          example: Respondent completed the survey
        count:
          type: integer
          description: Count of status code.
          example: 100
    TargetGroupsDraftQuotaDetailsV3:
      oneOf:
      - title: Targets with conditions and quota
        type: object
        description: Profile target with condition or conditions with quota.
        required:
        - id
        - conditions
        - quota
        properties:
          id:
            type: string
            description: The unique identifier for the quota.
            format: ULID
            example: 01JQMD8R7F0VW45KPWQ7WYNCFP
          name:
            type: string
            description: The name of the target.
            example: Target Name
          text:
            type: string
            description: Text of the used for display purpose.
            example: Condition Text
          text_translated:
            type: string
            description: Translated text of the condition used for display purpose.
            example: Condition Text
          conditions:
            type: array
            description: List of conditions for the quota.
            minItems: 1
            items:
              $ref: '#/components/schemas/ResponseProfileConditionsV3'
          quota:
            type: object
            required:
            - completes_goal_percentage
            - quota_nominal
            - completes_goal
            properties:
              name:
                type: string
                description: Name of the quota used for tracking. This will be deprecated, functionally replaced by the `target.name` field one layer up in the contract.
                deprecated: true
                example: SF_Quota_12
              completes_goal_percentage:
                type: number
                multipleOf: 0.01
                minimum: 0
                maximum: 100
                description: Percentage of total completes goal quota applied to this condition(s).
                example: 40
              quota_nominal:
                type: integer
                minimum: 0
                description: Total desired quota nominal applied to this condition(s).
                example: 40
              completes_goal:
                type: integer
                minimum: 0
                description: Total desired completes goal applied to this condition(s).
                example: 40
      - title: Targets with conditions and no quota
        type: object
        description: Profile target with condition or conditions with no quota.
        required:
        - id
        - conditions
        properties:
          name:
            type: string
            description: Name of the target group.
            example: MY-QUOTANAME-TARGET-1
          id:
            type: string
            description: The unique identifier for the quota.
            format: ULID
            example: 01JQMD8R7F0VW45KPWQ7WYNCFP
          text:
            type: string
            description: Text of the used for display purpose.
            example: Condition Text
          text_translated:
            type: string
            description: Translated text of the condition used for display purpose.
            example: Condition Text
          conditions:
            type: array
            description: List of conditions for the quota.
            minItems: 1
            items:
              $ref: '#/components/schemas/ResponseProfileConditionsV3'
    ProfilingResponse:
      oneOf:
      - title: Only profiles
        allOf:
        - $ref: '#/components/schemas/ProfilingDraftResponse'
      - title: Both template and profiles
        allOf:
        - $ref: '#/components/schemas/ProfilingDraftResponseWithTemplate'
      - title: No profiling
        type: object
        nullable: true
        properties: {}
        description: 'If no profiling is required, this field can be set to null or omitted.

          '
    MonetaryAmountRequestModel:
      type: object
      description: Represents a monetary value, including the amount and its currency.
      properties:
        value:
          type: string
          description: The monetary value, represented as a string to maintain precision.
          example: '2.7352'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
    Traceparent:
      type: string
      description: 'The traceparent header carries essential trace context information. This includes the trace ID and parent span ID  as defined by the W3C trace context specification. It is used to pinpoint the position of an incoming request within  the trace graph, facilitating the tracking of distributed operations.

        Note: This field is optional and will be automatically generated by the service if not provided in the request.  The generated value will be included in the response header.'
      example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    SoftLaunchAssisted:
      description: Assists the target group with soft launch functionality.
      type: boolean
      example: true
    TargetGroupLinks:
      type: object
      properties:
        links:
          type: object
          description: Contains external Target Group related links.
          properties:
            test_screener:
              type: string
              format: uri
              example: https://survey.someexamplesurveylink.com/s3/7189709/Example-survey?RID={RID}
              description: The test link into the study that the respondent gets redirected to upon qualification.
            test_client_survey:
              type: string
              format: uri
              example: https://survey.someexamplesurveylink.com/s3/7189709/Example-survey?RID={RID}
              description: The link into the study that the respondent gets redirected to upon qualification.
    TargetGroupStatusChangeReasonCode:
      type: string
      description: The reason code for the status change.
      enum:
      - max_cpi_limit_reached
      - live_respondent_unique_codes_exhausted
      - past_scheduled_end_date
      - total_completes_reached
      - past_soft_launch_end_date
      - no_completes_in_several_days
      - no_completes_after_many_prescreens
      - high_median_loi
      - excessive_redirect_errors
      - excessive_encryption_errors
      - excessive_qualification_setup_errors
      - high_drop_rates
      - low_epc
      - high_client_side_termination_rate
      example: max_cpi_limit_reached
    RequestDraftNoQuotaV3:
      type: object
      description: No quotas specified. The request will proceed without applying any quotas.
      required:
      - object
      - conditions
      properties:
        object:
          type: string
          description: Object field to distinguish the operation.
          enum:
          - nominal
          example: nominal
        conditions:
          type: array
          description: List of conditions.
          minItems: 1
          items:
            $ref: '#/components/schemas/InterlockProfileConditionsV3'
    MonetaryAmount:
      type: object
      description: Represents a monetary value, including the amount and its currency.
      properties:
        value:
          type: string
          description: A decimal encapsulated in a string representing the value in the denomination indicated by the code.
          example: '2.7352'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        currency_scale:
          allOf:
          - nullable: true
          - type: integer
            description: The number of digits after the decimal separator, as defined by ISO 4217.
            example: 2
    Error:
      type: object
      description: The standard error object returned for all failed API requests.
      required:
      - object
      - detail
      properties:
        id:
          type: string
          format: uuid
          description: A unique identifier for this specific error instance.
        object:
          type: string
          description: A short informative string identifying the type of the error
          pattern: ^([a-z]*_)*([a-z]*)$
        detail:
          type: string
          description: An error message provides a concise overview of the cause of the error.
        invalid_params:
          type: array
          nullable: true
          description: An optional field containing a list of invalid parameters may be presented in validation errors for additional information.
          items:
            $ref: '#/components/schemas/InvalidParam'
    FieldingAssistantModulesAssignmentRequestModel:
      title: Fielding Assistant modules assignment
      description: Having an assignment enables Fielding Assistant modules on a specified target group.  All modules are optional, their omission means they are not enabled.
      type: object
      properties:
        pricing:
          description: The pricing module configuration. The `type` field within the object determines the model (`dynamic` or `rate_card`).
          oneOf:
          - $ref: '#/components/schemas/ModuleDynamicPricing'
          - $ref: '#/components/schemas/ModuleRateCardPricing'
          nullable: true
        quota_overlay:
          $ref: '#/components/schemas/ModuleQuotaOverlay'
        pacing:
          description: The pacing module configuration. The `type` field within the object determines the pacing strategy (`linear`, `adaptive`, or `gemini`).
          oneOf:
          - $ref: '#/components/schemas/ModuleLinearPacing'
          - $ref: '#/components/schemas/ModuleAdaptivePacing'
          - $ref: '#/components/schemas/ModuleGeminiPacing'
          nullable: true
        soft_launch:
          $ref: '#/components/schemas/ModuleSoftLaunch'
    TargetGroupStatisticsIssuesSuggestions:
      type: array
      description: List of suggestions how to remedy the issues on the statistic.
      items:
        $ref: '#/components/schemas/TargetGroupStatisticsIssuesSuggestion'
    TargetGroupRespondentActivityExclusionsResponse:
      type: array
      description: The list of target groups and projects whose respondents should be excluded from this target group's survey.
      items:
        $ref: '#/components/schemas/RespondentActivityExclusionsIDsListResponse'
    ReEntryConfiguration:
      description: The re-entry configuration of a Target Group.
      type: object
      required:
      - completes
      - pre_client_survey_processes
      - financial_terms
      - terminates
      - security_failures
      - overquota
      - in_screener
      properties:
        completes:
          allOf:
          - $ref: '#/components/schemas/TargetGroupClientSideReEntryAttribute'
          - description: Whether to allow re-entry from Complete status.
        pre_client_survey_processes:
          allOf:
          - $ref: '#/components/schemas/TargetGroupScreenerSideReEntryAttribute'
          - description: Whether to allow re-entry from Pre Client Survey Processes status.
        financial_terms:
          allOf:
          - $ref: '#/components/schemas/TargetGroupScreenerSideReEntryAttribute'
          - description: Whether to allow re-entry from Financial Terms status.
        terminates:
          allOf:
          - $ref: '#/components/schemas/TargetGroupClientAndScreenerSideReEntryAttribute'
          - description: Whether to allow re-entry from Terminates status.
        security_failures:
          allOf:
          - $ref: '#/components/schemas/TargetGroupClientAndScreenerSideReEntryAttribute'
          - description: Whether to allow re-entry from Security Failures status.
        overquota:
          allOf:
          - $ref: '#/components/schemas/TargetGroupClientAndScreenerSideReEntryAttribute'
          - description: Whether to allow re-entry from Overquota status.
        in_screener:
          allOf:
          - $ref: '#/components/schemas/TargetGroupClientAndScreenerSideReEntryAttribute'
          - description: Whether to allow re-entry from InScreener status.
    TargetGroupCustomerReferenceNumber:
      type: string
      pattern: ^[a-zA-Z0-9\-_ ]*$
      minLength: 3
      maxLength: 128
      description: A customer-provided reference number for the target group.
      example: AB-00246246
    TargetGroupExpectedIncidenceRate:
      type: number
      format: float
      description: Expected incidence rate of the Target Group.
      minimum: 0
      maximum: 1
      multipleOf: 0.01
      example: 0.05
    ModuleRateCardPricing:
      title: Rate Card pricing
      type: object
      description: Manages pricing for a target group that uses a rate card model. This module cannot be used with `dynamic` pricing.
      properties:
        type:
          type: string
          enum:
          - rate_card
          description: The type of module. For this object, the value is always 'rate_card'.
        maximum_cpi:
          description: The maximum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        boost_cpi:
          description: Additional amount to be added to the CPI inferred from the rate card. Respects the `maximum_cpi` setting limit.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
      required:
      - type
    ModuleQuotaOverlay:
      title: Quota overlay
      type: object
      description: Controls how the overall completes goal is distributed across the target group's quotas.
      properties:
        prevent_overfill:
          type: boolean
          description: When `true`, this setting helps prevent quotas from exceeding their target number of completes.
          example: true
        balance_fill:
          type: boolean
          description: Whentrue, this setting ensures that quotas within the same demographic category fill at a similar rate.
          example: true
      required:
      - prevent_overfill
      - balance_fill
    TargetGroupLiveUrl:
      description: 'The link into the study that the respondent gets redirected to upon qualification.  Note:  This url must be HTTPS.'
      type: string
      example: https://example.com/live
    ProfilingDraftRequestWithTemplate:
      type: object
