    ProfileTargetsOpenEndedConditionsV3:
      title: Open-ended condition
      description: A profiling condition that targets open-ended text values.
      oneOf:
      - title: Allow All Values
        description: If `allow_all_values` is true, `open_ended_values` must be null.
        type: object
        properties:
          object:
            type: string
            description: The type of profiling condition. For this object, the value is always 'open_ended'.
            enum:
            - open_ended
            example: open_ended
          question_id:
            $ref: '#/components/schemas/QuestionID'
          allow_all_values:
            type: boolean
            enum:
            - true
            description: Flag to allow all values.
          open_ended_values:
            type: array
            minItems: 0
            maxItems: 0
            items:
              type: string
            nullable: true
            description: Must be null when `allow_all_values` is true.
        required:
        - object
        - question_id
        - allow_all_values
        - open_ended_values
      - title: Specific Open End Values
        description: If `allow_all_values` is false, `open_ended_values` must contain at least one open end value.
        type: object
        properties:
          object:
            type: string
            description: Object field to distinguish between different types of control selections.  Always is `open_ended`.
            enum:
            - open_ended
            example: open_ended
          question_id:
            $ref: '#/components/schemas/QuestionID'
          allow_all_values:
            type: boolean
            enum:
            - false
            description: Flag to allow only specific open end values.
          open_ended_values:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 10000
            description: List of applicable open end values. Required when `allow_all_values` is false. Note that only 10,000 values may be provided. For more than 10,000, please contact your integration consultant.
        required:
        - object
        - question_id
        - allow_all_values
        - open_ended_values
      example:
        object: open_ended
        question_id: 45
        open_ended_values: []
        allow_all_values: true
    EarningsPerClick:
      type: object
      description: Current Cost per Interview multiplied by completes so far, divided by the number of entrants.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmount'
    TargetGroupStatisticsIssueType:
      type: string
      description: The type of issue.
      enum:
      - warning
      - error
      example: warning
    ExclusionEntityType:
      type: string
      description: Indicates the entity type of the excluded element. Possible values are `RID` (Respondent ID) or `CID` (Access Respondent GUID)
      enum:
      - RID
      - CID
      example: RID
    CostPerInterviewUpdateResponse:
      type: object
      description: Response for cost per interview update.
      required:
      - target_group_cpi
      properties:
        target_group_cpi:
          $ref: '#/components/schemas/TargetGroupCpi'
  parameters:
    TargetGroupLanguage:
      name: language
      in: query
      description: Target Group language(s) to match against.
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z]{3}$
          example: eng
    TargetGroupName:
      name: name
