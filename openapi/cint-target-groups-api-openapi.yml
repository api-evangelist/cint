          example: 9284f2dc-421c-4f4a-ac68-6591c8fa4a38
        profile_adjustment_type:
          type: string
          description: "The method used to specify quota targets. Must be one of:\n  - **percentage**: specify a proportion of the total as a decimal with up to two decimal places (e.g. `12.34` for 12.34%).\n"
          example: percentage
          enum:
          - percentage
        profiles:
          type: array
          description: "The profiles to be added to the Target Group. \n**Constraint**: If using a template, if any template profile shares the same question as \na profile in the profiles array, the profile in the array takes precedence over the template profile.\n"
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestDraftRegularProfileV3'
    TargetGroupStatisticIssueReason:
