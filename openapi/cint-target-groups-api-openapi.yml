                  group_id:
                    description: id of group.
                    type: string
                    example: '123'
                  group_name:
                    description: only unique group names are valid.
                    type: string
                    example: Open group 1
                  min_percentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 0
                  max_percentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 100
                  suppliers:
                    $ref: '#/components/schemas/SupplierIds'
        private_exchange_allocations:
          type: object
          required:
          - blocked_supplier_ids
          - groups
          properties:
            blocked_supplier_ids:
              $ref: '#/components/schemas/SupplierIds'
            groups:
              type: array
              required:
              - group_id
              - group_name
              - min_percentage
              - max_percentage
              - supplier_id
              items:
                type: object
                properties:
                  group_id:
                    description: id of group.
                    type: string
                    example: '123'
                  group_name:
                    description: only unique group names are valid.
                    type: string
                    example: Private group 1
                  min_percentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 0
                  max_percentage:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 100
                  supplier_id:
                    type: string
                    example: '43'
    ConversionRate:
      type: number
      format: float
      description: The current conversion rate of the target group.
      minimum: 0
      maximum: 1
      example: 0.05
    QuotaOverlayBalanceFill:
      type: boolean
      description: Does not let quotas fill faster than the others within the same demography.
      example: true
    ReasonCode:
      type: string
      example: '2131'
    TargetGroupCollectedCompletesAggregatedIntervals:
      type: object
      required:
      - timestamp
      - count
      properties:
        timestamp:
          type: string
          format: date-time
          description: The timestamp that represents the time when the aggregated interval ends. RFC3339 UTC format, 3 fractional digits.
          example: '2023-01-01T23:00:00.000Z'
        count:
          type: integer
          description: The count of collected completes by the end of the aggregated interval.
    QuotaOverlayPreventOverfilling:
