    AverageCostPerInterview:
      type: object
      description: Average Cost per Interview for the Target Group.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmount'
    CostPerInterviewUpdateRequest:
      type: object
      description: Cost per interview update request.
      required:
      - target_group_cpi
      properties:
        target_group_cpi:
          $ref: '#/components/schemas/TargetGroupCpiRequestModel'
    ModuleAdaptivePacing:
      title: Adaptive even pacing
      type: object
      description: Increments quotas in regular intervals, recalculating steps after each interval to evenly pace  the rest of the Completes Goal until the end date.
      properties:
        type:
          type: string
          enum:
          - adaptive
          description: The type of module. For this object, the value is always 'adaptive'.
        increment_interval:
          $ref: '#/components/schemas/IncrementInterval'
      required:
      - type
      - increment_interval
    ExclusionEntityList:
      type: object
      properties:
        entity_type:
          $ref: '#/components/schemas/ExclusionEntityType'
        entity_ids:
          type: array
          items:
            $ref: '#/components/schemas/ExclusionEntityID'
    ComputeTargetGroupTransitionsFilters:
      type: object
      description: Filters for computing target group transitions.
      properties:
        status:
          $ref: '#/components/schemas/schemas-TargetGroupStatus'
        country:
          $ref: '#/components/schemas/TargetGroupCountry'
        language:
          $ref: '#/components/schemas/TargetGroupLanguage'
    TargetGroupIndustryLockoutCodeWithReference:
      type: string
      description: Blocks respondents during a certain timeframe based on whether they've taken a separate Target Group in the same industry. Get a list of all available lockout timeframes [here](#tag/Definitions/operation/get_industry_lockouts).
      example: past_30_days
    QuotaOverlayAssisted:
      description: Assists the target group with quota overlay functionality.
      type: boolean
      example: true
    TargetGroupChangelogBatch:
      type: object
      properties:
        id:
          type: string
          description: ID of the batch of changes applied.
        occurred_at:
          type: string
          description: Timestamp of when the batch of changes were applied.
        user:
          description: The details of the user who caused the batch of changes.
          oneOf:
          - type: object
            properties:
              type:
                type: string
                description: object field to distinguish between different types of users. always is `las_user`.
                enum:
                - las_user
              las_user_id:
                description: The LAS id of the user causing the change.
                allOf:
                - $ref: '#/components/schemas/UserID'
          - type: object
            properties:
              type:
                type: string
                description: object field to distinguish between different types of users. always is `system_marketplace_user`.
                enum:
                - system_marketplace_user
          - type: object
            properties:
              type:
                type: string
                description: object field to distinguish between different types of users. always is `system_user`.
                enum:
                - system_user
        changes:
          type: array
          description: 'An array of changelog items containing the new and old value for a property. While both the

            new and the old value are nullable, at any given time at most one of them will be null.

            '
          items:
            $ref: '#/components/schemas/TargetGroupChangelogItem'
    InvalidParam:
      type: object
      description: Describes a single invalid parameter in a request.
      properties:
        name:
          type: string
          description: The name of the parameter that failed validation.
        reason:
          type: string
          description: A short explanation of why the parameter was invalid.
      required:
      - name
      - reason
    IncrementInterval:
      type: string
      format: duration
      example: P1DT5H
      description: 'The duration between each quota increment, in ISO-8601 format.


        Key details:


        * **Format:** Must follow the `PnDTnHnMnS` pattern (e.g., `P1D` for one day, `PT12H` for 12 hours).

        * **Limit:** The duration must be less than 398 days.

        '
    QuestionID:
      type: integer
      description: The unique identifier for a profiling question.
      example: 12413
    TargetGroupExclusionEnabled:
      type: boolean
      description: Whether or not the given target groups exclusion status within the given exclusion policy is set to active
    StudyTypeCodeWithReference:
      type: string
      description: Uniquely identifies the Study Type that indicates the Target Group limits and purpose. Get a list of all available Study Types [here](#tag/Definitions/operation/get_study_types).
      default: adhoc
      example: diary
    TargetGroupStatus:
      type: string
      enum:
      - draft
      - scheduled
      - live
      - paused
      - completed
      - archived
      description: Target Group Status.
      example: draft
    TargetGroupOverview:
      type: object
      description: Basic attributes and statistics of a Target Group.
      required:
      - project_name
      - target_group_name
      - project_manager_id
      - progress
      - pricing_model
      - is_pricing_restricted
      - current_cost_per_interview
      - current_cost
      - status
      - country_code
      - language_code
      - conversion_rate
      - drop_off_rate
      - incidence_rate
      - created_at
      properties:
        project_name:
          type: string
          description: Name of the Project which contains the Target Group.
          example: Example Project
        target_group_name:
          type: string
          description: Name of the Target Group.
          example: Example Target Group
        human_readable_id:
          $ref: '#/components/schemas/TargetGroupHumanReadableID'
        project_manager_id:
          $ref: '#/components/schemas/UserID'
        progress:
          $ref: '#/components/schemas/TargetGroupProgress'
        pricing_model:
          $ref: '#/components/schemas/TargetGroupPricingModel'
        is_pricing_restricted:
          type: boolean
          description: True when there are target group CPI restrictions in place from fielding assistant, otherwise false.
          example: true
        current_cost_per_interview:
          description: Currently active Cost per Interview for the Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        average_cost_per_interview:
          description: Average Cost per Interview for the Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        current_cost:
          description: The total cost of the completes collected so far in this Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        status:
          $ref: '#/components/schemas/TargetGroupStatus'
        country_code:
          type: string
          description: String representing country code.
          example: US
        language_code:
          type: string
          description: String representing language code.
          example: ENG
        conversion_rate:
          $ref: '#/components/schemas/ConversionRate'
        drop_off_rate:
          $ref: '#/components/schemas/DropOffRate'
        incidence_rate:
          $ref: '#/components/schemas/IncidenceRate'
        median_length_of_interview_seconds:
          allOf:
          - $ref: '#/components/schemas/MedianLengthOfInterviewSeconds'
          - nullable: true
        study_type_code:
          $ref: '#/components/schemas/StudyTypeCode'
        target_group_customer_reference_number:
          allOf:
          - $ref: '#/components/schemas/TargetGroupCustomerReferenceNumber'
          - nullable: true
        created_at:
          type: string
          format: date-time
          description: Date and time when the target group was created (RFC3339 UTC format, 3 fractional digits).
          example: '2023-01-01T23:00:00.000Z'
    TargetGroupStatisticIssue:
      type: object
      description: Issue connected to a target group statistic
      properties:
        reason:
          $ref: '#/components/schemas/TargetGroupStatisticIssueReason'
        issue_type:
          $ref: '#/components/schemas/TargetGroupStatisticsIssueType'
        suggestions:
          $ref: '#/components/schemas/TargetGroupStatisticsIssuesSuggestions'
      required:
      - suggestions
      - issue_type
    TargetGroupClientID:
      type: integer
      format: int32
      description: Client ID associated with the created Target Group
      example: 1234
      nullable: true
    ProfileTargetsResponseRangeConditionsV3:
      type: object
      required:
      - object
      - question_id
      - min
      - max
      properties:
        object:
          type: string
          description: Object field to distinguish between different types of control selections.  Always is `range`.
          enum:
          - range
          example: range
        question_id:
          $ref: '#/components/schemas/QuestionID'
        min:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: The minimum numeric value (inclusive).
          example: 18
        max:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: The maximum numeric value (inclusive).
          example: 24
        condition_name:
          type: string
          description: The name of the condition. This field will be present if the condition is part of a blended or grouped target.
          example: 18 to 24
        condition_name_translated:
          type: string
          description: The name of the condition translated (when appropriate and available). This field will be present if the condition is part of a blended or grouped target.
          example: 18 to 24
    TargetGroupID:
      description: A unique identifier for the target group, in ULID format.
      type: string
      pattern: ^[0-9A-Z]{26}$
      example: 01BTGNYV6HRNK8K8VKZASZCFP1
    ProfileTemplateIdWithProfileAdjustmentType:
      type: object
