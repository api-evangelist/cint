        profile_adjustment_type:
          type: string
          description: "The method used to specify quota targets. Must be one of:\n  - **percentage**: specify a proportion of the total as a decimal with up to two decimal places (e.g. `12.34` for 12.34%).\n  - **nominal**: specify an exact number of completes as an integer.\n"
