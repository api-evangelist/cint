  /demand/accounts/{account_id}/projects/{project_id}/target-groups/{target_group_id}/respondent-activity-exclusions:
    parameters:
    - $ref: '#/components/parameters/AccountID'
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/TargetGroupID'
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
    get:
      operationId: get_target_group_respondent_activity_exclusions
      summary: Retrieves respondent activity exclusions for a target group
      description: 'Retrieves the list of target groups and/or projects whose respondents are to be excluded from taking the survey associated with the specified `target_group_id`.

        '
      tags:
      - Respondent Exclusions
      responses:
        '200':
          description: Respondent activity exclusions were retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespondentActivityExclusionsResponse'
              example:
                respondent_activity_exclusions:
                - type: target-group
                  id: 01KH2714RHRTGCGQV47FHHY8S8
                  duration: P90D
                - type: project
                  id: 01KH287TE2W1GKTJJ91QCCHWP9
                  duration: P90D
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            tracestate:
              $ref: '#/components/headers/Tracestate'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    put:
      operationId: set_target_group_respondent_activity_exclusions
      summary: Set the respondent activity exclusions for a target group
      description: "Set the list of target groups and/or projects whose respondents you want to exclude from the specified `target_group_id`. \n\nThe request body specifies the projects and target groups whose respondent activity should be excluded from the target group identified in the path.\nEach exclusion item can optionally specify a `duration` (ISO-8601 period format, date-based only, e.g. `P90D` for 90 days) controlling how far back to look for respondent activity. Must be between 1 and 396 days. A `duration` can also be set at the request root level to apply as the default for all items. Per-item durations override the request-level default. If neither is specified, the duration defaults to P90D (90 days).\nExclusions apply when there are completes within each exclusion item's configured `duration`. The request must not include the same target group specified in the path parameters, nor the project it belongs to, as a target group cannot exclude its own respondent activity or that of its parent project.\n\n:::important\nThis operation will overwrite any previous existing list. Make sure to include previously saved target groups or projects in your request.\nIf the Target Group is already live, updating its respondent activity exclusions will only affect future respondent traffic. Any respondents who have already entered or completed the Target Group under the previous exclusion settings cannot be retroactively changed. Please review your changes carefully before switching the target group to live.\n:::\n"
      tags:
      - Respondent Exclusions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRespondentActivityExclusionsRequest'
      responses:
        '204':
          description: Successfully updated respondent activity exclusions.
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '500':
          $ref: '#/components/responses/Error_Internal'
components:
  schemas:
    UpdateDate:
      type: string
      format: date-time
      example: '2023-01-01T23:00:00.000Z'
      description: Time of last update
    JobID:
      description: The character string representing a unique job ID.
      type: string
      example: 01BTGNYV6HRNK8K8VKZASZCFP1
    SetRespondentActivityExclusionsRequest:
      type: object
      required:
      - respondent_activity_exclusions
      properties:
        duration:
          type: string
          format: duration
          default: P90D
          description: 'Default exclusion period in ISO-8601 period format (date-based only, e.g. P30D, P2W, P3M, P1Y) applied to all items that do not specify their own duration. Must be between 1 and 396 days. Time-based values such as PT1H are not supported. If omitted, items without an explicit duration default to P90D (90 days). **Note**: month-based periods are calendar-aware and adjust to the last valid day of the resulting month. For example, looking back one month from March 31 results in February 28 (or February 29 in a leap year). If the duration is provided using week format (e.g. P2W), the week value will be translated and persisted in days as a normalization process (e.g. P2W becomes P14D).'
          example: P90D
        respondent_activity_exclusions:
          $ref: '#/components/schemas/RespondentActivityExclusionsList'
    ExclusionGroupTag:
      description: A user-defined tag that acts as a name for the exclusion group.
      type: string
      maxLength: 128
      example: 2025 Tracker
    UpdatedBy:
      type: string
      description: Who last updated this entity
      example: User1234
    ExclusionGroupID:
      description: A unique identifier for the exclusion group, in ULID format.
      type: string
      pattern: ^[0-9A-Z]{26}$
      example: 01BTGNYV6HRNK8K8VKZASZCFP1
    ExclusionsJobFailureReason:
      type: object
      description: The reason for the failure of a job.
      required:
      - code
      - description
      properties:
        code:
          type: string
          example: JobExecutionStartMessageFailed
        description:
          type: string
          example: The job execution start message failed. Please contact Cint for further assistance.
    CobraIDListPaginatedResponse:
