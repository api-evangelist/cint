          example:
          - 5a3b2ada-0066-4dcb-afdd-7302be78ce9e
          - 5a3b2ada-0066-4dcb-afdd-7302be78ce9f
        next_cursor:
          type: string
          description: An ID of the next list of items and indicator that there are more items than currently viewable
          example: MDFKUkc0UFdISDRKMEpWRVRTTTNKTlZKWlcmMGVmZmRjOTctMTYxZS00NmJlLWJlM2MtNTU5NTYyMWU3ZDcx
        url:
          type: string
          description: The relative URL for the next page of results.
          example: accounts/1/projects/01JBHD5A2NEW7JTV8KZGGTC2V2/target-groups/01JNNEJ3GC0Y713BBKGKC147DP/exclusions/access-respondent-guid/paginated
    GetExclusionGroupsByTargetGroupResponse:
      type: object
      description: List of Exclusion Groups including the given target group
