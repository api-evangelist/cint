      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExclusionGroupInfo'
        next_cursor:
          type: string
          description: An ID of the next list of items and indicator that there are more items than currently viewable.
          example: MDFKUkc0UFdISDRKMEpWRVRTTTNKTlZKWlcmMGVmZmRjOTctMTYxZS00NmJlLWJlM2MtNTU5NTYyMWU3ZDcx
        url:
          type: string
          description: URL to fetch the next page of Exclusion Groups.
          example: accounts/13/exclusion-groups/01JW97M2Y5Q5KB0N543B4G4T5Y/exclusions/target-groups
    RespondentActivityExclusionsIdObjectRequest:
      type: object
      required:
      - type
      - id
      properties:
        type:
          description: The type of entity related to the `id`. This value can either be `target-group` or `project`.
          type: string
          enum:
          - target-group
          - project
          example: target-group
        id:
          description: the unique entity ID.
          type: string
          format: ulid
          example: 01KH2714RHRTGCGQV47FHHY8S8
        duration:
          description: 'The exclusion period for this item in ISO-8601 period format (date-based only, e.g. P30D, P2W, P3M, P1Y). Must be between 1 and 396 days. Time-based values such as PT1H are not supported. Overrides the request-level duration if both are provided. If neither this nor the request-level duration is set, defaults to P90D (90 days). **Note**: month-based periods are calendar-aware and adjust to the last valid day of the resulting month. For example, looking back one month from March 31 results in February 28 (or February 29 in a leap year). If the duration is provided using week format (e.g. P2W), the week value will be translated and persisted in days as a normalization process (e.g. P2W becomes P14D).'
          type: string
          format: duration
          default: P90D
    ExclusionEnabled:
      type: boolean
      description: Indicates if the target group should exclude respondents from other target groups within the same project.
    InvalidParam:
