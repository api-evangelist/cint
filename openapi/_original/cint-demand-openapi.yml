    SetRespondentActivityExclusionsRequest:
      type: object
      required:
      - respondent_activity_exclusions
      properties:
        duration:
          type: string
          format: duration
          default: P90D
          description: 'Default exclusion period in ISO-8601 period format (date-based only, e.g. P30D, P2W, P3M, P1Y) applied
            to all items that do not specify their own duration. Must be between 1 and 396 days. Time-based values such as
            PT1H are not supported. If omitted, items without an explicit duration default to P90D (90 days). **Note**: month-based
            periods are calendar-aware and adjust to the last valid day of the resulting month. For example, looking back
            one month from March 31 results in February 28 (or February 29 in a leap year). If the duration is provided using
            week format (e.g. P2W), the week value will be translated and persisted in days as a normalization process (e.g.
            P2W becomes P14D).'
          example: P90D
        respondent_activity_exclusions:
          $ref: '#/components/schemas/RespondentActivityExclusionsList'
