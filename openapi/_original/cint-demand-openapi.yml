      schema:
        type: array
        items:
          $ref: '#/components/schemas/TargetGroupStatus'
    TargetGroupCountry:
      name: country
      in: query
      description: Target Group country or countries to match against. Get a list of all available countries [here](#tag/Definitions/operation/list_all_question_categories).
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z]{2}$
          example: us
