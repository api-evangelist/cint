  /demand/accounts/{account_id}/projects/{project_id}/batch-jobs/resume-fielding-runs-by-target-group-id:
    post:
      summary: Creates a job to resume multiple target groups
      description: "This endpoint creates a bulk job to resume fielding runs for a list of specified target group IDs. This\
        \ action will resume the fielding \nruns for previously paused target groups. A target group can only be resumed if\
        \ its completes goal and end date have not yet been reached.\nIf a target group is already live, the system considers\
        \ the action successful.\n\nTo ensure that the same job is not created multiple times, this endpoint uses an `Idempotency-Key`\
        \ from the request header. If a job \nwith the same key has already been submitted, the system will not create a new\
        \ one but will treat the operation as successful and \nreturn the same successful response as for a newly created\
        \ job.\n\nUpon successful submission, the system creates a new bulk job to start the actual processing asynchronously.\
        \ This means the endpoint returns a \nresponse quickly without waiting for the entire bulk operation to complete.\
        \ If the job is created successfully or if it already existed \ndue to the idempotency key, the endpoint returns a\
        \ `201 Created` status code with the job ID in the `Location` header.\n\nTo check the status of the job, you can use\
        \ the job ID returned in the `Location` header with the `Retrieve a bulk job status` endpoint.\nThe processing of\
        \ the job will continue even if an operation on an individual target group fails. The final job status will list which\
        \ target groups \nwere updated successfully and which ones failed.\n"
      operationId: create_bulk_resume_target_groups_job
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        description: A list of target group IDs to be resumed.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkResumeTargetGroupJobRequest'
            example:
              target_group_ids:
              - 01BTGNYV6HRNK8K8VKZASZCFP1
              - 01BTGNYV6HRNK8K8VKZASZCFP2
      tags:
      - Fielding (Batch)
      responses:
        '201':
          description: The job was created successfully. Poll the URL in the `Location` header to track its status.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            tracestate:
              $ref: '#/components/headers/Tracestate'
            location:
              $ref: '#/components/headers/Location'
              example: /demand/accounts/101/projects/01BTGNYV6HRNK8K8VKZASZCFP0/batch-jobs/resume/01BTGNYV6HRNK8K8VKZASZCFP1
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
