    RequestDraftQuotaV3:
      description: |
        A request targets block must be one of:
          • a nominal target based on profile adjustement type (see RequestDraftGroupedQuotaNominalV3)
          • a percentage target based on profile adjustment type (see RequestDraftGroupedQuotaV3)
          • no target (empty object) should be in alignment with quota_enabled field as false.
      oneOf:
      - title: Targets with nominal value in quota
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RequestDraftQuotaNominalV3'
      - title: Targets with percentage value in quota
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RequestDraftQuotaPercentageV3'
      - title: Targets with conditions and no quota
        type: array
        minItems: 1
        items:
          $ref: '#/components/schemas/RequestDraftNoQuotaV3'
    Traceparent:
      type: string
      description: |-
        The traceparent header carries essential trace context information. This includes the trace ID and parent span ID  as defined by the W3C trace context specification. It is used to pinpoint the position of an incoming request within  the trace graph, facilitating the tracking of distributed operations.
        Note: This field is optional and will be automatically generated by the service if not provided in the request.  The generated value will be included in the response header.
      example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    RequestDraftQuotaNominalV3:
      type: object
