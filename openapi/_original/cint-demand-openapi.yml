        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkUpdateTargetGroupProjectManagerJobRequest'
            example:
            - project_manager_id: b551326b-ac9d-4d32-8823-4f025787dab9
            - target_group_ids:
              - 01BTGNYV6HRNK8K8VKZASZCFP1
              - 01BTGNYV6HRNK8K8VKZASZCFP2
      tags:
      - Target Groups (Batch)
      responses:
        '201':
          description: Returns a 201 Created response with a Location header pointing to the newly created job.
          headers:
            traceparent:
              description: The `traceparent` header carries the trace ID and parent span ID, as defined by the W3C Trace Context
                specification. It's used to trace a single request as it moves through multiple services.
              required: false
              schema: *id001
            tracestate:
              description: The `tracestate` header complements the `traceparent` header by carrying vendor-specific trace
                information. This allows different services to add their own data to a trace.
              required: false
              schema: *id002
            location:
              description: |
                Contains the URL where a new resource can be found, often returned with a `201 Created` response. It follows the format defined in RFC 7231.
              required: true
              schema: &id003
                type: string
                format: uri-reference
                description: A reference to the resource's location. This can be a full URL, a relative path, or just the
                  resource ID.
                example:
                  full-url:
                    summary: A full URL to the resource
                    value: https://api.cint.com/demand/business-units
                  relative-path:
                    summary: A relative path to the resource
                    value: /demand/business-units
                  resource-id:
                    summary: A resource ID
                    value: fe666fcd-490c-4cb4-b4e0-2f86e15c27e6
