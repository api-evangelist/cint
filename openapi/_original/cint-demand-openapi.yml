      - has_more
      properties:
        url:
          type: string
          description: URL which produced this list (without query parameters).
          example: /accounts/543587/projects/01BX5ZZKBKACTAV9WEVGEMMVRZ/target-groups
        has_more:
          type: boolean
          description: If there are further results to be shown using the returned next cursor or previous cursor, this will
            be true, otherwise false.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
        target_groups:
          type: array
          description: Array of Target Group list items, representing the results of the query.
          items:
            $ref: '#/components/schemas/TargetGroupsListItem'
    TargetGroupClientID:
      type: integer
      format: int32
      description: Client ID associated with the created Target Group
      example: 1234
      nullable: true
    TargetGroupChangelogList:
      type: object
      properties:
        changelog:
          type: array
          items:
            $ref: '#/components/schemas/TargetGroupChangelogBatch'
        next_cursor:
          type: string
          description: Provides the UUID to use as the "start_after" value of the next request. Empty value if no further
            results.
      example:
        changelog:
        - id: 1a8fa143-22ee-4b69-9779-401a411152fa
          occurred_at: '2023-09-11T09:27:41Z'
          user:
            type: las_user
            las_user_id: 16839d21-3329-408e-aa53-a7996cb8919e
          changes:
          - object: name_change
            new_value: Typo Fix
            old_value: Tpyo Fix
          - object: test_url_change
            new_value: https://myawesomeresearch.com/test
            old_value: null
          - object: cpi_note_change
            new_value:
              value: '1'
              currency_code: USD
              currency_scale: 2
            old_value:
              value: '5'
              currency_code: USD
              currency_scale: 2
        next_cursor: ''
    SupplierResponse:
