              type: integer
              description: The minimum percentage of supply to source from the open exchange.
              example: 0
              minimum: 0
              maximum: 100
            exchange_max_percentage:
              type: integer
              description: The maximum percentage of supply to source from the open exchange.
              example: 100
              minimum: 0
              maximum: 100
            groups:
              type: array
              description: A list of specific supplier groups. To create a new group, omit the `group_id`. To update an existing
                group, include its `group_id`.
              items:
                type: object
                required:
                - group_name
                - min_percentage
                - max_percentage
                - supplier_ids
                properties:
                  group_id:
                    type: string
                    description: The unique identifier for an existing group you want to update. Omit this field to create
                      a new group.
                    example: '1'
                  group_name:
                    type: string
                    description: The display name of the supplier group.
                    example: Test group
                  min_percentage:
                    type: integer
                    description: The minimum percentage of supply traffic for this group.
                    example: 0
                    minimum: 0
                    maximum: 100
                  max_percentage:
                    type: integer
                    description: The maximum percentage of supply traffic for this group.
                    example: 100
                    minimum: 0
                    maximum: 100
                  supplier_ids:
                    description: A list of supplier IDs to include in this group.
                    $ref: '#/components/schemas/SupplierIds'
        private_exchange_allocations:
          type: object
          description: Defines the allocation rules for suppliers from private exchanges.
          required:
          - blocked_supplier_ids
          - groups
          properties:
            blocked_supplier_ids:
              description: A list of supplier IDs to block from private exchanges.
              $ref: '#/components/schemas/SupplierIds'
            groups:
              type: array
              description: A list of private exchange groups. Each group contains exactly one supplier.
              items:
                type: object
                required:
                - group_name
                - min_percentage
                - max_percentage
                - supplier_id
                properties:
                  group_id:
                    type: string
                    description: The unique identifier for an existing group you want to update. Omit this field to create
                      a new group.
                    example: '234'
                  group_name:
                    type: string
                    description: The display name of the supplier group.
                    example: Test group
                  min_percentage:
                    type: integer
                    description: The minimum percentage of supply traffic for this group.
                    example: 0
                    minimum: 0
                    maximum: 100
                  max_percentage:
                    type: integer
                    description: The maximum percentage of supply traffic for this group.
                    example: 100
                    minimum: 0
                    maximum: 100
                  supplier_id:
                    type: string
                    description: The unique identifier of the single supplier for this private exchange group.
