            required:
            - target_group_id
        has_more:
          type: boolean
          description: This field is always `false` as the list of updated or failed target groups is not paginated and will
            always be returned in full.
          enum:
          - false
      required:
      - data
      - has_more
    GetBulkCompleteTargetGroupJobResponse:
      type: object
      description: Bulk complete target groups job details.
      properties:
        job_id:
