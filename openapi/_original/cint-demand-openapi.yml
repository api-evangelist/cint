        documentation for more information.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: API Key Authentication
  headers:
    Tracestate:
      description: The `tracestate` header complements the `traceparent` header by carrying vendor-specific trace information.
        This allows different services to add their own data to a trace.
      required: false
      schema: *id002
    Location:
      description: |
        Contains the URL where a new resource can be found, often returned with a `201 Created` response. It follows the format defined in RFC 7231.
      required: true
      schema: *id003
    ETag:
      description: The `ETag` header provides a unique identifier that represents the current version of a resource. It's
        used for caching and to prevent concurrent modification issues.
      required: true
      schema:
        $ref: '#/components/schemas/ETag'
    Traceparent:
      description: The `traceparent` header carries the trace ID and parent span ID, as defined by the W3C Trace Context specification.
        It's used to trace a single request as it moves through multiple services.
      required: false
      schema: *id001
    IsSyntheticTraffic:
      description: 'Boolean value representing whether request is the product of synthetic traffic. By default, set to false. '
      schema:
        $ref: '#/components/schemas/IsSyntheticTraffic'
    IdempotencyKey:
      description: |
        A unique key that you can provide to safely retry requests without accidentally performing the same operation twice.

        We suggest using a UUID v4 or another random string with sufficient entropy to avoid collisions.

        Examples:
        - 96C65204-90C2-4DCB-9393-B8226DD50C76
        - 01BTGNYV6HRNK8K8VKZASZCFP0
      required: false
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
