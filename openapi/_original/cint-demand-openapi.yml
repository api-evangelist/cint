  responses:
    Error_NotFound:
      description: A requested resource isn't found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 7a5972ba-0825-4360-b852-fa2430e47034
            object: not_found_error
            detail: resource not found
    Error_UnsupportedMediaType:
      description: The request content format is not supported.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 7a5972ba-0825-4360-b852-fa2430e47034
            object: unsupported_media_type_error
            detail: The 'Content-Type' header is incorrectly set 'application/pdf'
    Error_Forbidden:
      description: A requested is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: fe68cdd2-ee87-4dbf-8950-63c5cbca94c7
            object: authorization_error
            detail: you don't have the right permissions to perform this operation
    Error_Unauthorized:
      description: A request is unauthorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 1dcf0f40-f0d1-4cf6-8c00-c3d019d32faf
            object: authorization_error
            detail: no valid authorization provided for this operation
    Error_Conflict:
      description: An already existing resource has conflicts with the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 3d61d9c3-68ee-4026-b436-6e76a2b33932
            object: conflict_error
            detail: this operation causes conflict(s) on the resources
    Error_BadRequest:
      description: A request is not valid and can't be processed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 9e278238-d011-4e05-8327-1ce1d5d26254
            object: bad_request_error
            detail: Expected field 'foo' is missing.
    Error_ContentTooLarge:
      description: The request entity was larger than limits defined by the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 7a5972ba-0825-4360-b852-fa2430e47034
            object: content_too_large_error
            detail: File upload limit exceeded
    Error_Internal:
      description: A request failed due to an internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: d94b8bb2-a540-4a91-9c05-2aa3ae9a5e1e
            object: unexpected_internal_error
            detail: an internal error has led to the failure of this operation
    Error_InvalidState:
      description: A request failed due to invalid state of the entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: d94b8bb2-a540-4a91-9c05-2aa3ae9a5e1e
            object: invalid_state_error
            detail: The entity does not meet the required state.
    Error_BadRequest_DemandAPI:
      description: A request is not valid and can't be processed.
      headers:
        traceparent:
          $ref: '#/components/headers/Traceparent'
        tracestate:
          $ref: '#/components/headers/Tracestate'
        is-synthetic-traffic:
          $ref: '#/components/headers/IsSyntheticTraffic'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClientErrorDemandAPI'
    Error_Internal_DemandAPI:
      description: A request failed due to an internal error.
      headers:
        traceparent:
          $ref: '#/components/headers/Traceparent'
        tracestate:
          $ref: '#/components/headers/Tracestate'
        is-synthetic-traffic:
          $ref: '#/components/headers/IsSyntheticTraffic'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorDemandAPI'
    WebhookEventsHistory:
      description: A response containing webhook events history for replay and debugging.
      content:
        application/json:
          schema:
            type: object
            properties:
              events:
                type: array
                description: A list of webhook events
                items:
                  $ref: '#/components/schemas/WebhookEvent'
              next_cursor:
                $ref: '#/components/schemas/NextCursor'
            additionalProperties: false
    Error_RateLimit:
      description: The request was rate limited. Please retry after the specified delay.
      headers:
        traceparent:
          description: The `traceparent` header carries the trace ID and parent span ID, as defined by the W3C Trace Context
            specification. It's used to trace a single request as it moves through multiple services.
          required: false
          schema: *id001
        tracestate:
          description: The `tracestate` header complements the `traceparent` header by carrying vendor-specific trace information.
            This allows different services to add their own data to a trace.
          required: false
          schema: *id002
        retry-After:
          description: The number of seconds to wait before making a follow-up request.
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TooManyRequestsProblemDetails'
    Error_MethodNotAllowed:
      description: A request is valid but not supported by the current state of the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 10e53384-803e-4cb6-b8c2-d93fa196ea8e
            object: method_not_allowed_error
            detail: Cannot complete a target group which is paused.
    Precondition_Failed:
      description: The resource could not be modified because the ETag in the If-Match header does not match the current version.
        This means the resource was updated by another request after you retrieved it.
      headers:
        traceparent:
          description: The `traceparent` header carries the trace ID and parent span ID, as defined by the W3C Trace Context
            specification. It's used to trace a single request as it moves through multiple services.
          required: false
          schema: *id001
        tracestate:
          description: The `tracestate` header complements the `traceparent` header by carrying vendor-specific trace information.
            This allows different services to add their own data to a trace.
          required: false
          schema: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            id: 3d61d9c3-68ee-4026-b436-6e76a2b33932
            object: precondition_failed_error
            detail: The resource has been modified since you last retrieved it. Please fetch the latest version and try your
              request again.
  requestBodies:
    WebhookCreate:
      description: The request body for creating a new webhook subscription.
      required: true
      content:
        application/json:
          schema:
            type: object
            description: The configuration for a new webhook subscription.
            required:
            - url
            - events
            properties:
              url:
                $ref: '#/components/schemas/WebhookURL'
              events:
                $ref: '#/components/schemas/WebhookEventTypes'
          example:
            url: https://example.com/webhook
            events:
            - target-group-updated
    WebhookUpdate:
      description: Update an existing webhook request body.
      required: true
      content:
        application/json:
          schema:
            type: object
            description: The updated configuration for an existing webhook. Both fields are optional.
            properties:
              url:
                $ref: '#/components/schemas/WebhookURL'
              events:
                $ref: '#/components/schemas/WebhookEventTypes'
          example:
            url: https://example.com/webhook
            events:
            - session-updated
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
