    GetRedactedPricePredictionResponse:
      type: object
      description: A price prediction containing the estimated cost per interview (CPI) for the Open Exchange and applicable
        Private Exchanges.
      required:
      - buyer_account_id
      - buyer_business_unit_id
      - buyer_business_unit_exchange_rate_from_usd
      - open_exchange_price
      - private_exchange_prices
      properties:
        buyer_account_id:
          $ref: '#/components/schemas/AccountID'
        buyer_business_unit_id:
          $ref: '#/components/schemas/BusinessUnitID'
        buyer_business_unit_exchange_rate_from_usd:
          type: number
          format: float
          description: The live exchange rate towards USD.
        open_exchange_price:
          allOf:
          - $ref: '#/components/schemas/OpenExchangePricePrediction'
        private_exchange_prices:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/PrivateExchangePricePrediction'
    GetTargetGroupPriceResponse:
      type: object
      description: The pricing details for a target group, including the pricing context (e.g., dynamic or rate card) and
        cost per interview (CPI).
      required:
      - price_type
      - buyer_account_id
      - buyer_business_unit_id
      - target_group_id
      - buyer_business_unit_exchange_rate_from_usd
      - open_exchange_price
      - private_exchange_prices
      - pricing_config_token
      properties:
        price_type:
          type: string
          enum:
          - specification
          - prediction
          description: Indicates whether the price is a specification or a prediction.
        buyer_account_id:
          $ref: '#/components/schemas/AccountID'
        buyer_business_unit_id:
          $ref: '#/components/schemas/BusinessUnitID'
        target_group_id:
          $ref: '#/components/schemas/TargetGroupID'
        buyer_business_unit_exchange_rate_from_usd:
          type: number
          format: float
          description: The exchange rate from the buyer's business unit currency to USD at the time the target group was launched.
        pricing_config_token:
          $ref: '#/components/schemas/PricingConfigToken'
        open_exchange_price:
          type: object
          description: The pricing context and cost per interview for the Cint Open Exchange.
          required:
          - pricing_context
          - cost_per_interview
          properties:
            pricing_context:
              oneOf:
              - $ref: '#/components/schemas/DynamicPricingContext'
              - $ref: '#/components/schemas/RateCardPricingContext'
            cost_per_interview:
              $ref: '#/components/schemas/MonetaryAmount'
        private_exchange_prices:
          type: array
          description: Pricing details for each applicable Private Exchange supplier.
          items:
            type: object
            required:
            - supplier_id
            - pricing_context
            - cost_per_interview
            properties:
              pricing_context:
                oneOf:
                - $ref: '#/components/schemas/DynamicPricingContext'
                - $ref: '#/components/schemas/RateCardPricingContext'
              supplier_id:
                type: string
                example: '43'
              cost_per_interview:
                $ref: '#/components/schemas/MonetaryAmount'
    DynamicPricingPredictionConfig:
      title: Dynamic pricing configuration
      type: object
      description: Configuration used for dynamic pricing, specifying the user-requested cost per interview.
      required:
      - type
      - user_requested_cpi
      properties:
        type:
          type: string
          enum:
          - dynamic
          description: The pricing model. For this configuration, the value is always 'dynamic'. (And 'rate_card' respectively).
        user_requested_cpi:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
          description: The requested CPI chosen by the user.
    RateCardPredictionConfig:
      title: Rate card pricing configuration
      type: object
      description: Configuration used for rate card pricing.
      required:
      - type
      - country_code
      - expected_incidence_rate
      - expected_length_of_interview_minutes
      properties:
        type:
          type: string
          enum:
          - rate_card
          description: Descriptor of the pricing model type.
        maximum_cpi:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
          description: The maximum cost per interview (CPI) that can be set for the target group.
        cpi_boost:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
          description: An additional amount added on top of the CPI calculated from the rate card. The final CPI will not
            exceed the `maximum_cpi`.
        country_code:
          type: string
          description: The two-letter country code, adhering to ISO 3166-1 alpha-2.
          example: US
        expected_length_of_interview_minutes:
          type: integer
          format: int32
          description: The expected median length of interview, in minutes.
          minimum: 1
          maximum: 45
          example: 1
        expected_incidence_rate:
          type: number
          format: float
          description: The expected incidence rate (IR) of the target audience, expressed as a decimal (e.g., 0.25 for 25%).
          minimum: 0
          maximum: 1
          multipleOf: 0.01
          example: 0.05
    MonetaryAmount:
      type: object
      description: Represents a monetary value, including the amount and its currency.
      properties:
        value:
          type: string
          description: A decimal encapsulated in a string representing the value in the denomination indicated by the code.
          example: '2.7352'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        currency_scale:
          allOf:
          - nullable: true
          - type: integer
            description: The number of digits after the decimal separator, as defined by ISO 4217.
            example: 2
    RateCardToken:
      type: string
      description: An opaque token that uniquely identifies the rate card configuration used in a pricing calculation.
      example: MDFKSE42MDQ1RFg2Tk0wQjlBQ0Q5QVhQQzk7Nw==
    MonetaryAmountRequestModel:
      type: object
      description: Represents a monetary value, including the amount and its currency.
      properties:
        value:
          type: string
          description: The monetary value, represented as a string to maintain precision.
          example: '2.7352'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
    PrivateExchangePricePrediction:
      type: object
      description: Contains the predicted pricing details for a single Private Exchange supplier.
      required:
      - pricing_context
      - supplier_id
      - cost_per_interview
      properties:
        pricing_context:
          description: The pricing context used in the calculation. The `type` field within the object indicates the model
            (`rate_card` or `dynamic`).
          oneOf:
          - $ref: '#/components/schemas/DynamicPricingContext'
          - $ref: '#/components/schemas/RateCardPricingContext'
        supplier_id:
          type: string
          description: The supplier ID of the private exchange supplier.
          example: '3214'
        cost_per_interview:
          $ref: '#/components/schemas/MonetaryAmount'
    GetRedactedPricePredictionRequest:
      type: object
      description: The request body for generating a price prediction.
      required:
      - config
      properties:
        config:
          description: The pricing configuration. The `type` field within the object determines which model to use (`rate_card`
            or `dynamic`).
          oneOf:
          - $ref: '#/components/schemas/RateCardPredictionConfig'
          - $ref: '#/components/schemas/DynamicPricingPredictionConfig'
    PricingConfigToken:
      type: string
      description: A unique token representing an immutable pricing configuration.
      example: MDFKSE42MDQ1RFg2Tk0wQjlBQ0Q5QVhQQzk7Nw==
    RateCardPricingContext:
      type: object
      description: The pricing context when a rate card model is used.
      required:
      - type
      - rate_card_token
      properties:
        type:
          type: string
          enum:
          - rate_card
          description: The pricing model. For this context, the value is always 'rate_card'.
        maximum_cpi:
          $ref: '#/components/schemas/MonetaryAmount'
          description: The maximum cost per interview (CPI) allowed for this pricing context.
        cpi_boost:
          $ref: '#/components/schemas/MonetaryAmount'
          description: An additional amount added to the calculated rate card CPI. The final CPI will not exceed the `maximum_cpi`.
        rate_card_token:
          $ref: '#/components/schemas/RateCardToken'
    OpenExchangePricePrediction:
      type: object
      description: Contains the predicted pricing details for the Cint Exchange.
      required:
      - pricing_context
      - cost_per_interview
      properties:
        pricing_context:
          description: The pricing context used in the calculation. The `type` field within the object indicates the model
            (`rate_card` or `dynamic`).
          oneOf:
          - $ref: '#/components/schemas/DynamicPricingContext'
          - $ref: '#/components/schemas/RateCardPricingContext'
        cost_per_interview:
          $ref: '#/components/schemas/MonetaryAmount'
    DynamicPricingContext:
      type: object
      description: The pricing context when a dynamic model is used.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - dynamic
          description: The pricing model. For this context, the value is always 'dynamic'.
    TargetGroupFieldingSpecification:
      type: object
      description: Contains Target Group fielding details.
      required:
      - start_at
      - end_at
      properties:
        start_at:
          type: string
          format: date-time
          description: The timestamp the Target Group is scheduled to start at (RFC3339 UTC format, 3 fractional digits).
          example: '2023-01-01T23:00:00.000Z'
        end_at:
          type: string
          format: date-time
          description: The timestamp the Target Group is scheduled to end at (RFC3339 UTC format, 3 fractional digits).
          example: '2023-01-01T23:00:00.000Z'
    TargetGroupFeasibilityResponseAllocationSpecification:
      type: object
      description: Contains the feasibility results for the open and private exchange allocations.
      required:
      - open_exchange_allocations
      properties:
        open_exchange_allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityResponseOpenExchangeAllocations'
        private_exchange_allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityResponsePrivateExchangeAllocations'
    CalculateTargetGroupFeasibilityByIdRequest:
      type: object
      description: Specifies the parameters to override when calculating feasibility for an existing target group.
      properties:
        locale:
          type: string
          description: Locale code with language and country.
          example: eng_us
        collects_pii:
          type: boolean
          description: Indicates whether or not the target group collects Personally Identifiable Information (PII).
          example: true
        incidence_rate:
          type: number
          description: The expected incidence rate (IR) of the target audience, expressed as a decimal (e.g., 0.25 for 25%).
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          example: 0.5
        length_of_interview:
          type: integer
          description: The expected median length of the interview, in minutes.
          minimum: 1
          maximum: 45
          example: 20
        completes_goal:
          type: integer
          description: The desired number of completed interviews.
          minimum: 1
          maximum: 10000
          example: 40
        start_at:
          type: string
          format: date-time
          description: The start date and time of the target group. Must be earlier than the 'end_at'.
          example: '2023-01-01T23:00:00.000Z'
        end_at:
          type: string
          format: date-time
          description: The end date and time of the target group. Must be later than the 'start_at'.
          example: '2023-01-31T23:00:00.000Z'
        step_days:
          type: number
          minimum: 0
          description: The number of days for each step when using an `even_paced` fielding strategy. This field is optional.
        cost_per_interview:
          description: The desired Cost Per Interview (CPI) for the filling goal suggestion. For dynamic pricing, this serves
            as an initial suggestion. For rate card pricing, this field is ignored. If both `cost_per_interview` and `price`
            are provided, `cost_per_interview` takes precedence.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        price:
          description: Alias for `cost_per_interview`. If both `price` and `cost_per_interview` are provided, `cost_per_interview`
            takes precedence.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        rate_card_price_boost:
          description: The CPI boost value to apply over the rate card pricing. Ignored when the pricing is not rate card
            based.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        profiling:
          type: object
          description: Contains the targeting demographic criteria and adjustment type.
          properties:
            profile_adjustment_type:
              type: string
              description: Defines how quotas are specified in the `targets` array. Use `percentage` to define quotas as a
                percentage of the `completes_goal`, or `nominal` to define them as a specific number of completes.
              enum:
              - percentage
              - nominal
              example: percentage
            profiles:
              type: array
              description: List of profiles.
              items:
                $ref: '#/components/schemas/FeasibilityRequestDraftRegularProfileV3'
        allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityRequestAllocationSpecification'
    TargetGroupFeasibilityRequestOpenExchangeAllocations:
      type: object
      description: Defines the allocation settings for the Cint Open Exchange.
      required:
      - blocked_supplier_ids
      - exchange_min_percentage
      - exchange_max_percentage
      - groups
      properties:
        blocked_supplier_ids:
          type: array
          description: A list of supplier IDs to block from the Cint Open Exchange.
          items:
            type: string
            example: '234'
        exchange_min_percentage:
          type: integer
          description: The minimum percentage of completes that must come from the Cint Open Exchange.
          example: 0
        exchange_max_percentage:
          type: integer
          description: The maximum percentage of completes that can come from the Cint Open Exchange.
          example: 100
        groups:
          type: array
          description: A list of specific supplier groups within the Cint Open Exchange.
          items:
            $ref: '#/components/schemas/TargetGroupFeasibilityRequestOpenExchangeAllocationsGroup'
    FeasibilityQuotaDetailsV3:
      type: object
      description: Feasibility targets for provided conditions.
      required:
      - conditions
      - quota
      properties:
        conditions:
          type: array
          minItems: 1
          description: List of conditions.
          items:
            $ref: '#/components/schemas/InterlockProfileConditionsV3'
        quota:
          type: object
          required:
          - min_completes
          - max_completes
          properties:
            min_completes:
              $ref: '#/components/schemas/FeasibilityCompletesProjection'
            max_completes:
              $ref: '#/components/schemas/FeasibilityCompletesProjection'
    CalculateTargetGroupFeasibilityRequest:
      type: object
      description: The complete set of specifications for a new (draft) target group to calculate its feasibility.
      required:
      - business_unit_id
      - locale
      - expected_incidence_rate
      - expected_length_of_interview_minutes
      - fielding_specification
      - completes_goal
      properties:
        business_unit_id:
          type: integer
          description: Unique identifier of the business unit.
          example: 1234
        locale:
          type: string
          description: Locale code with language and country.
          example: eng_us
        collects_pii:
          type: boolean
          description: Indicates whether or not the target group collects Personally Identifiable Information (PII).
          example: true
        expected_incidence_rate:
          type: number
          description: Percentage of respondents that will qualify for the study after targeting using standard qualifications.
          minimum: 0
          exclusiveMinimum: true
          maximum: 1
          example: 0.5
        expected_length_of_interview_minutes:
          type: integer
          description: Expected time to finish the target group in minutes.
          minimum: 1
          maximum: 45
          example: 20
        completes_goal:
          type: integer
          description: Indicates the new value for completes goal.
          minimum: 1
          maximum: 10000
          example: 40
        fielding_specification:
          $ref: '#/components/schemas/TargetGroupFieldingSpecification'
        step_days:
          type: number
          minimum: 0
          description: optional value of step days for when FA strategy is even paced.
        cost_per_interview:
          description: The desired Cost Per Interview (CPI) for the feasibility calculation. For dynamic pricing, this serves
            as an initial suggestion. For rate card pricing, this field is ignored. If both `cost_per_interview` and `price`
            are provided, `cost_per_interview` takes precedence.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        price:
          description: Alias for `cost_per_interview`. If both `price` and `cost_per_interview` are provided, `cost_per_interview`
            takes precedence.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        rate_card_price_boost:
          description: The CPI boost value to apply over the rate card pricing. Ignored when the pricing is not rate card
            based.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        profiling:
          type: object
          description: Contains the targeting demographic criteria and adjustment type.
          required:
          - profile_adjustment_type
          - profiles
          properties:
            profile_adjustment_type:
              type: string
              example: percentage
            profiles:
              type: array
              description: List of profiles.
              items:
                $ref: '#/components/schemas/FeasibilityRequestDraftRegularProfileV3'
        allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityRequestAllocationSpecification'
      example:
        business_unit_id: 1234
        locale: eng_us
        expected_incidence_rate: 0.25
        expected_length_of_interview_minutes: 15
        completes_goal: 500
        fielding_specification:
          start_at: '2024-08-01T10:00:00.000Z'
          end_at: '2024-08-31T10:00:00.000Z'
        profiling:
          profile_adjustment_type: percentage
          profiles:
          - object: regular
            quotas_enabled: true
            targets:
            - conditions:
              - object: range
                question_id: 12413
                min: 18
                max: 34
              quota:
                completes_goal_percentage: 50
    TargetGroupFeasibilityResponsePrivateExchangeAllocations:
      type: object
      description: Contains the feasibility results for Private Exchange allocation groups.
      required:
      - groups
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TargetGroupFeasibilityResponsePrivateExchangeAllocationsGroup'
    FeasibilityResponseDraftRegularProfileV3:
      description: Contains the feasibility breakdown for a profiling quota. The `object` field distinguishes between `regular`
        and `blended` profiles.
      oneOf:
      - title: Regular Profile
        type: object
        required:
        - object
        - targets
        properties:
          object:
            type: string
            description: Object field to distinguish the operation.
            enum:
            - regular
            example: regular
          targets:
            $ref: '#/components/schemas/FeasibilityQuotaV3'
      - title: Blended Profile
        type: object
        required:
        - object
        - targets
        properties:
          object:
            type: string
            description: Object field to distinguish the operation.
            enum:
            - blended
            example: blended
          blended_type:
            type: string
            description: The blended_type field defines the functional behavior of the blended profile as either interlock
              or control. If omitted, the system defaults to interlock. This field distinguishes between profiles requiring
              a full matrix expansion (interlock) and those used for isolating specific demographic segments (control).
            enum:
            - interlock
            - control
            example: interlock
          targets:
            $ref: '#/components/schemas/FeasibilityQuotaV3'
    TargetGroupFeasibilityRequestOpenExchangeAllocationsGroup:
      type: object
      description: Defines a single supplier group within the Cint Open Exchange allocation.
      required:
      - group_name
      - min_percentage
      - max_percentage
      - suppliers
      properties:
        group_name:
          type: string
          description: A unique name for the allocation group. This name must be unique across all groups in both the open
            and private exchange allocations.
          example: Unique Test group name
        min_percentage:
          type: integer
          description: The minimum percentage of the total completes that must come from this group.
          example: 0
        max_percentage:
          type: integer
          description: The maximum percentage of the total completes that can come from this group.
          example: 100
        suppliers:
          type: array
          description: A list of supplier IDs to include in this group.
          items:
            type: string
            example: '434'
        supplier_id:
          type: string
          description: The ID of the Private Exchange supplier for this group.
          example: '43'
    TargetGroupFeasibilityRequestPrivateExchangeAllocationsGroup:
      type: object
      description: Defines a single supplier group within a Private Exchange allocation.
      required:
      - group_name
      - min_percentage
      - max_percentage
      - supplier_id
      properties:
        group_name:
          type: string
          example: Test group
        min_percentage:
          type: integer
          example: 0
        max_percentage:
          type: integer
          example: 100
        supplier_id:
          type: string
          example: '43'
    ProfileTargetsRangeConditionsV3:
      title: Range condition
      type: object
      description: A profiling condition that targets a numeric range (e.g. age).
      required:
      - object
      - question_id
      - min
      - max
      properties:
        object:
          type: string
          description: The type of profiling condition. For this object, the value is always 'range'.
          enum:
          - range
          example: range
        question_id:
          $ref: '#/components/schemas/QuestionID'
        min:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: The minimum numeric value (inclusive).
          example: 18
        max:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
          description: The maximum numeric value (inclusive).
          example: 24
    QuestionID:
      type: integer
      description: The unique identifier for a profiling question.
      example: 12413
    TargetGroupFeasibilityRequestAllocationSpecification:
      type: object
      description: Defines the complete set of allocation settings for a feasibility request.
      required:
      - open_exchange_allocations
      - private_exchange_allocations
      properties:
        open_exchange_allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityRequestOpenExchangeAllocations'
        private_exchange_allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityRequestPrivateExchangeAllocations'
    TargetGroupFeasibilityResponsePrivateExchangeAllocationsGroup:
      type: object
      required:
      - group_name
      - min_completes
      - max_completes
      properties:
        group_name:
          type: string
          example: Test group
        min_completes:
          type: integer
          example: 55
        max_completes:
          type: integer
          example: 85
    FeasibilityCompletesProjection:
      type: object
      description: Projection of completes for feasibility condition.
      properties:
        projected_completes_percentage:
          type: number
          multipleOf: 0.01
          minimum: 0
          maximum: 100
          description: Percentage of total projected completes applied to this condition(s).
          example: 40
        projected_completes_goal:
          type: number
          format: int32
          minimum: 0
          description: Nominal of total projected completes applied to this condition(s).
          example: 40
    ProfileTargetsSelectionConditionsV3:
      title: Selection condition
      type: object
      description: A profiling condition that targets a specific answer option (e.g. gender).
      required:
      - object
      - question_id
      - option
      properties:
        object:
          type: string
          description: The type of profiling condition. For this object, the value is always 'selection'.
          enum:
          - selection
          example: selection
        question_id:
          $ref: '#/components/schemas/QuestionID'
        option:
          type: string
          description: The unique identifier for the selected answer option.
          example: '1'
    CalculateTargetGroupFeasibilityResponse:
      type: object
      description: Target Group feasibility information.
      required:
      - suggested_price
      properties:
        suggested_price:
          description: The single-point cost for the suggested Cost Per Interview (CPI).
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        suggested_price_range:
          type: object
          description: A suggested CPI range, which may be provided if a single-point price is not available.
          required:
          - min
          - max
          properties:
            min:
              $ref: '#/components/schemas/MonetaryAmount'
            max:
              $ref: '#/components/schemas/MonetaryAmount'
        suggested_completes_goal_range:
          type: object
          description: The suggested completes goal range estimates the minimum and maximum number of completions achievable
            based on the target group details.
          required:
          - min
          - max
          properties:
            min:
              type: integer
              minimum: 0
              example: 25
            max:
              type: integer
              minimum: 0
              example: 30
        profiles:
          type: array
          description: Provides feasibility per quota based on the profiles submitted with the request.
          items:
            $ref: '#/components/schemas/FeasibilityResponseDraftRegularProfileV3'
        allocations:
          $ref: '#/components/schemas/TargetGroupFeasibilityResponseAllocationSpecification'
    FeasibilityQuotaV3:
      type: array
      minItems: 1
      items:
        $ref: '#/components/schemas/FeasibilityQuotaDetailsV3'
    ProfileTargetsOpenEndedConditionsV3:
      title: Open-ended condition
      description: A profiling condition that targets open-ended text values.
      oneOf:
      - title: Allow All Values
        description: If `allow_all_values` is true, `open_ended_values` must be null.
        type: object
        properties:
          object:
            type: string
            description: The type of profiling condition. For this object, the value is always 'open_ended'.
            enum:
            - open_ended
            example: open_ended
          question_id:
            $ref: '#/components/schemas/QuestionID'
          allow_all_values:
            type: boolean
            enum:
            - true
            description: Flag to allow all values.
          open_ended_values:
            type: array
            minItems: 0
            maxItems: 0
            items:
              type: string
            nullable: true
            description: Must be null when `allow_all_values` is true.
        required:
        - object
        - question_id
        - allow_all_values
        - open_ended_values
      - title: Specific Open End Values
        description: If `allow_all_values` is false, `open_ended_values` must contain at least one open end value.
        type: object
        properties:
          object:
            type: string
            description: Object field to distinguish between different types of control selections.  Always is `open_ended`.
            enum:
            - open_ended
            example: open_ended
          question_id:
            $ref: '#/components/schemas/QuestionID'
          allow_all_values:
            type: boolean
            enum:
            - false
            description: Flag to allow only specific open end values.
          open_ended_values:
            type: array
            items:
              type: string
            minItems: 1
            maxItems: 10000
            description: List of applicable open end values. Required when `allow_all_values` is false. Note that only 10,000
              values may be provided. For more than 10,000, please contact your integration consultant.
        required:
        - object
        - question_id
        - allow_all_values
        - open_ended_values
      example:
        object: open_ended
        question_id: 45
        open_ended_values: []
        allow_all_values: true
    TargetGroupFeasibilityResponseOpenExchangeAllocations:
      type: object
      description: Contains the feasibility results for the Cint Open Exchange, including projected completes and group breakdowns.
      required:
      - min_completes
      - max_completes
      - groups
      properties:
        min_completes:
          type: integer
          description: The minimum number of completes projected to be achievable from the Cint Open Exchange.
          example: 55
        max_completes:
          type: integer
          description: The maximum number of completes projected to be achievable from the Cint Open Exchange.
          example: 85
        groups:
          type: array
          description: A breakdown of projected completes for each specific supplier group.
          items:
            $ref: '#/components/schemas/TargetGroupFeasibilityResponseOpenExchangeAllocationsGroup'
    FeasibilityRequestQuotaV3:
      type: array
      description: A list of quota definitions for a profile.
      minItems: 1
      items:
        $ref: '#/components/schemas/FeasibilityRequestQuotaDetailsV3'
    FeasibilityRequestQuotaDetailsV3:
      type: object
      description: Feasibility targets for provided conditions.
      required:
      - conditions
      properties:
        name:
          type: string
          description: The name of the target.
          example: Target Name
        conditions:
          type: array
          minItems: 1
          description: List of conditions.
          items:
            $ref: '#/components/schemas/InterlockProfileConditionsV3'
        quota:
          description: The desired quota. The structure of this object depends on the `profile_adjustment_type` set at the
            parent `profiling` level. Use `completes_goal_percentage` for `percentage` mode, and `completes_goal` for `nominal`
            mode.
          oneOf:
          - title: profile_adjustment_type is `percentage`
            type: object
            properties:
              completes_goal_percentage:
                type: number
                multipleOf: 0.01
                minimum: 0
                maximum: 100
                description: Percentage of total completes goal quota applied to this condition(s).
                example: 40
          - title: profile_adjustment_type is `nominal`
            type: object
            properties:
              completes_goal:
                type: integer
                minimum: 0
                description: Total desired completes goal applied to this condition(s).
                example: 40
    FeasibilityRequestDraftRegularProfileV3:
      description: Defines the profiling criteria for a feasibility request. The `object` field distinguishes between `regular`
        and `blended` profiles.
      oneOf:
      - title: Regular Profile
        type: object
        required:
        - object
        - quotas_enabled
        - targets
        properties:
          object:
            type: string
            description: Object field to distinguish the operation.
            enum:
            - regular
            example: regular
          quotas_enabled:
            type: boolean
            description: A flag that indicates if quotas are enabled for this profile.
            example: true
          targets:
            $ref: '#/components/schemas/FeasibilityRequestQuotaV3'
      - title: Blended Profile
        type: object
        required:
        - object
        - quotas_enabled
        - targets
        properties:
          object:
            type: string
            description: Object field to distinguish the operation.
            enum:
            - blended
            example: blended
          blended_type:
            type: string
            description: The blended_type field defines the functional behavior of the blended profile as either interlock
              or control. If omitted, the system defaults to interlock. This field distinguishes between profiles requiring
              a full matrix expansion (interlock) and those used for isolating specific demographic segments (control).
            enum:
            - interlock
            - control
            example: interlock
          quotas_enabled:
            type: boolean
            description: indicator boolean whether quotas are enabled on the given profile.
            example: true
          targets:
            $ref: '#/components/schemas/FeasibilityRequestQuotaV3'
    TargetGroupFeasibilityRequestPrivateExchangeAllocations:
      type: object
      description: Defines the allocation settings for Private Exchanges.
      required:
      - blocked_supplier_ids
      - groups
      properties:
        blocked_supplier_ids:
          type: array
          description: A list of supplier IDs to block from all Private Exchanges.
          items:
            type: string
            example: '435'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/TargetGroupFeasibilityRequestPrivateExchangeAllocationsGroup'
    InterlockProfileConditionsV3:
      description: A polymorphic object representing a single profiling condition, which can be a `selection`, `range`, or
        `open_ended` type.
      oneOf:
      - $ref: '#/components/schemas/ProfileTargetsSelectionConditionsV3'
      - $ref: '#/components/schemas/ProfileTargetsRangeConditionsV3'
      - $ref: '#/components/schemas/ProfileTargetsOpenEndedConditionsV3'
    TargetGroupFeasibilityResponseOpenExchangeAllocationsGroup:
      type: object
      required:
      - group_name
      - min_completes
      - max_completes
      properties:
        group_name:
          type: string
          example: Test group
        min_completes:
          type: integer
          example: 55
        max_completes:
          type: integer
          example: 85
    ModuleDynamicPricing:
      title: Dynamic pricing
      type: object
      description: |
        Controls the Cost Per Interview (CPI) to achieve a 100% fill rate by the target group's end date as cost-effectively as possible.

        Key behaviors:

        * **Prerequisite:** This module can only be used for target groups configured with dynamic pricing.
        * You must specify either `total_budget` or `maximum_cpi`, but not both.
        * If you specify `minimum_cpi`, it must be lower than the `maximum_cpi`.
        * The `total_budget` setting can overrule the `minimum_cpi`.
      properties:
        type:
          type: string
          enum:
          - dynamic
          description: The type of module. For this object, the value is always 'dynamic'.
        total_budget:
          description: The maximum total amount to spend for the target number of completes.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        maximum_cpi:
          description: The maximum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        minimum_cpi:
          description: The minimum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
      required:
      - type
    ModuleLinearPacing:
      title: Linear even pacing
      type: object
      description: Paces fielding by incrementing the completes goal in regular intervals until the target group's end date.
      properties:
        type:
          type: string
          enum:
          - linear
          description: The type of module. For this object, the value is always 'linear'.
        increment_interval:
          $ref: '#/components/schemas/IncrementInterval'
      required:
      - type
      - increment_interval
    IncrementInterval:
      type: string
      format: duration
      example: P1DT5H
      description: |
        The duration between each quota increment, in ISO-8601 format.

        Key details:

        * **Format:** Must follow the `PnDTnHnMnS` pattern (e.g., `P1D` for one day, `PT12H` for 12 hours).
        * **Limit:** The duration must be less than 398 days.
    ModuleQuotaOverlay:
      title: Quota overlay
      type: object
      description: Controls how the overall completes goal is distributed across the target group's quotas.
      properties:
        prevent_overfill:
          type: boolean
          description: When `true`, this setting helps prevent quotas from exceeding their target number of completes.
          example: true
        balance_fill:
          type: boolean
          description: Whentrue, this setting ensures that quotas within the same demographic category fill at a similar rate.
          example: true
      required:
      - prevent_overfill
      - balance_fill
    ModuleRateCardPricing:
      title: Rate Card pricing
      type: object
      description: Manages pricing for a target group that uses a rate card model. This module cannot be used with `dynamic`
        pricing.
      properties:
        type:
          type: string
          enum:
          - rate_card
          description: The type of module. For this object, the value is always 'rate_card'.
        maximum_cpi:
          description: The maximum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        boost_cpi:
          description: Additional amount to be added to the CPI inferred from the rate card. Respects the `maximum_cpi` setting
            limit.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
      required:
      - type
    FieldingAssistantModulesAssignment:
      title: Fielding Assistant modules assignment
      description: A container for all enabled Fielding Assistant modules for a target group. Each module is optional; if
        a module is omitted or set to `null`, it is considered disabled.
      type: object
      properties:
        pricing:
          oneOf:
          - $ref: '#/components/schemas/ModuleDynamicPricing'
          - $ref: '#/components/schemas/ModuleRateCardPricing'
          nullable: true
        quota_overlay:
          allOf:
          - $ref: '#/components/schemas/ModuleQuotaOverlay'
          nullable: true
        pacing:
          oneOf:
          - $ref: '#/components/schemas/ModuleLinearPacing'
          - $ref: '#/components/schemas/ModuleAdaptivePacing'
          - $ref: '#/components/schemas/ModuleGeminiPacing'
          nullable: true
        soft_launch:
          allOf:
          - $ref: '#/components/schemas/ModuleSoftLaunch'
          nullable: true
    ModuleGeminiPacing:
      title: Gemini pacing
      type: object
      description: Always collects at most as many completes on each quota, as were collected on an exposed target group.
        Intended for Measurement control target groups.
      properties:
        type:
          type: string
          enum:
          - gemini
          description: The type of module. For this object, the value is always 'gemini'.
        exposed_target_group_id:
          type: string
          format: ulid
          description: Uniquely identifies exposed target group by ID.
          example: 01HC2Z6TM8C4F3Y5CA6S2JR475
      required:
      - type
      - exposed_target_group_id
    ModuleAdaptivePacing:
      title: Adaptive even pacing
      type: object
      description: Increments quotas in regular intervals, recalculating steps after each interval to evenly pace  the rest
        of the Completes Goal until the end date.
      properties:
        type:
          type: string
          enum:
          - adaptive
          description: The type of module. For this object, the value is always 'adaptive'.
        increment_interval:
          $ref: '#/components/schemas/IncrementInterval'
      required:
      - type
      - increment_interval
    FieldingAssistantModulesAssignmentRequestModel:
      title: Fielding Assistant modules assignment
      description: Having an assignment enables Fielding Assistant modules on a specified target group.  All modules are optional,
        their omission means they are not enabled.
      type: object
      properties:
        pricing:
          description: The pricing module configuration. The `type` field within the object determines the model (`dynamic`
            or `rate_card`).
          oneOf:
          - $ref: '#/components/schemas/ModuleDynamicPricing'
          - $ref: '#/components/schemas/ModuleRateCardPricing'
          nullable: true
        quota_overlay:
          $ref: '#/components/schemas/ModuleQuotaOverlay'
        pacing:
          description: The pacing module configuration. The `type` field within the object determines the pacing strategy
            (`linear`, `adaptive`, or `gemini`).
          oneOf:
          - $ref: '#/components/schemas/ModuleLinearPacing'
          - $ref: '#/components/schemas/ModuleAdaptivePacing'
          - $ref: '#/components/schemas/ModuleGeminiPacing'
          nullable: true
        soft_launch:
          $ref: '#/components/schemas/ModuleSoftLaunch'
    ModuleSoftLaunch:
      title: Soft launch
      type: object
      description: Manages a soft launch of a target group. During a soft launch, pacing modules are ignored.
      properties:
        end_at:
          type: string
          description: The soft launch will be finished at this date, and the target group paused regardless of the fill.
          format: date-time
          example: '2023-01-01T23:00:00.000Z'
        filling_goal_percentage:
          description: The percentage of the full filling goal to collect during the soft launch phase.
          type: integer
          minimum: 1
          maximum: 100
          example: 1
        demographics_strictness_percentage:
          description: Controls how strictly the soft launch's demographic distribution should follow the full launch's distribution.
            A value of `100` aims to match the distribution perfectly, while `0` allows any distribution.
          type: integer
          minimum: 0
          maximum: 100
          example: 1
      required:
      - end_at
      - filling_goal_percentage
      - demographics_strictness_percentage
    ModuleDynamicPricingRequestModel:
      title: Dynamic pricing
      type: object
      description: |
        Controls the Cost Per Interview (CPI) to achieve a 100% fill rate by the target group's end date as cost-effectively as possible.

        Key behaviors:

        * **Prerequisite:** This module can only be used for target groups configured with dynamic pricing.
        * You must specify either `total_budget` or `maximum_cpi`, but not both.
        * If you specify `minimum_cpi`, it must be lower than the `maximum_cpi`.
      properties:
        type:
          type: string
          enum:
          - dynamic
          description: The type of module. For this object, the value is always 'dynamic'.
        total_budget:
          description: The maximum total amount to spend for the target number of completes.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        maximum_cpi:
          description: The maximum cost per interview (CPI) that the module is allowed to set. Must be higher than the minimum,
            if specified. Only one of `maximum_cpi` or `total_budget` can be specified.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        minimum_cpi:
          description: The minimum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
      required:
      - type
    ModuleRateCardPricingRequestModel:
      title: Rate Card module
      type: object
      description: This module can only be used for target groups with rate card pricing. It does not support target groups
        with `dynamic` pricing.
      properties:
        type:
          type: string
          enum:
          - rate_card
          description: The type of module. For this object, the value is always 'rate_card'.
        maximum_cpi:
          description: The maximum cost per interview (CPI) that the module is allowed to set.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
        boost_cpi:
          description: Additional amount to be added to the CPI inferred from the rate card. Respects the `maximum_cpi` setting
            limit.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmountRequestModel'
      required:
      - type
    CreateBulkCompleteTargetGroupJobRequest:
      type: object
      description: Request body for creating a bulk complete target groups job.
      properties:
        target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
      required:
      - target_group_ids
    CreateBulkLaunchTargetGroupJobRequest:
      type: object
      description: Request body for creating a bulk launch target groups job.
      properties:
        target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
      required:
      - target_group_ids
    BulkFailedTargetGroups:
      type: object
      description: A list of target groups that failed to be processed in the bulk job, along with the reason for failure.
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              target_group_id:
                $ref: '#/components/schemas/TargetGroupID'
              failure_reason:
                $ref: '#/components/schemas/BulkJobFailureReason'
            required:
            - target_group_id
            - failure_reason
        has_more:
          type: boolean
          description: This field is always `false` as the list of updated or failed target groups is not paginated and will
            always be returned in full.
          enum:
          - false
      required:
      - data
      - has_more
    TargetGroupIds:
      type: array
      description: An array of unique target group identifiers to be processed in a bulk job.
      minItems: 1
      items:
        $ref: '#/components/schemas/TargetGroupID'
    TargetGroupName:
      type: string
      description: A human-readable name for the target group.
      minLength: 5
      maxLength: 128
      example: Test Target Group
    GetBulkResumeTargetGroupJobResponse:
      type: object
      description: Bulk resume target groups job details.
      properties:
        job_id:
          $ref: '#/components/schemas/JobID'
        created_at:
          type: string
          format: date-time
          description: The date and time when the job was created.
          example: '2023-01-01T23:00:00.000Z'
        created_by:
          $ref: '#/components/schemas/UserID'
        status:
          $ref: '#/components/schemas/BulkJobStatus'
          description: The current status of the bulk job.
        updated_target_groups:
          $ref: '#/components/schemas/BulkUpdatedTargetGroups'
        failed_target_groups:
          $ref: '#/components/schemas/BulkFailedTargetGroups'
      required:
      - job_id
      - created_at
      - created_by
      - status
      - updated_target_groups
      - failed_target_groups
    BulkJobFailureReason:
      type: object
      properties:
        code:
          type: string
          description: A machine-readable code for the failure reason.
          example: TargetGroupNotFound
        description:
          type: string
          description: A human-readable explanation of why the operation failed for this target group.
          example: Target group not found.
    CreateBulkPauseTargetGroupJobRequest:
      type: object
      description: Request body for creating a bulk pause target groups job.
      properties:
        target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
      required:
      - target_group_ids
    BulkUpdatedTargetGroups:
      type: object
      description: A list of target groups that were successfully processed in the bulk job.
      properties:
        data:
          type: array
          items:
