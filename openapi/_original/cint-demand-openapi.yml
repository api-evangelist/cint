      description: |
        The (partial) name of the target group to match against. Supports partial and stemmed matching. This query parameter is deprecated and replaced by the `search_string` parameter. If only the `name` parameter is supplied, it will be used as if it was the `search_string`. If both `name` and `search_string` are supplied, `name` will be ignored.
      schema:
        type: string
        example: My Target Gr
    TargetGroupCustomerReferenceNumbers:
      name: target_group_customer_reference_numbers
      in: query
      description: |
        An array of target group customer reference numbers to filter by. When there are no other filter or search parameters supplied, the call will return a list of target groups that match these values.
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/TargetGroupCustomerReferenceNumber'
    CountryCode:
      in: query
