        object:
          type: string
          default: unprocessable_entity_error
        title:
          type: string
          default: profile request validation
        detail:
          type: string
          pattern: ^Validation error.*?$
        invalid_params:
          type: array
          description: An array of detailed validation errors for specific parts of the profile configuration.
          items:
            oneOf:
            - $ref: '#/components/schemas/InvalidParamData'
            - $ref: '#/components/schemas/InvalidParamStructure'
            discriminator:
              propertyName: error_type
              mapping:
                data_validation_error: '#/components/schemas/InvalidParamData'
                structural_error: '#/components/schemas/InvalidParamStructure'
      example:
        object: unprocessable_entity_error
        title: profile request validation
        detail: 'Validation error: The provided profile configuration is invalid.'
        invalid_params:
        - error_type: data_validation_error
          name: profile_validation_error_001
          reason: profile_condition_min_greater_than_max_001
          detail: The minimum value cannot be greater than the maximum value.
          metadata:
            profile_id: 01H8XGJWBWBAQ4J1Z5F4A9C3K8
            question_id:
            - 123
            error_level: error
      required:
      - object
      - detail
    ManageCreateProfileQuotaDetailsV3:
      type: object
      description: quota nominal-specific fields
      required:
      - completes_goal
      properties:
        completes_goal:
          type: integer
          minimum: 0
          description: Total desired completes goal applied to this condition(s).
          example: 40
    RequestDraftRegularProfileV3:
      oneOf:
      - title: Regular Profile
        type: object
        required:
        - object
        - quotas_enabled
        - targets
        properties:
          object:
            type: string
            description: |
              Object field to distinguish the operation.
            enum:
            - regular
            example: regular
          name:
            type: string
            description: "The name of the regular profile. \n"
            example: SF_YoungAge
          quotas_enabled:
            type: boolean
            description: Flag indicating if quotas are enabled.
            example: true
          targets:
            $ref: '#/components/schemas/RequestDraftQuotaV3'
      - title: Blended Profile
        type: object
        required:
        - object
        - name
        - quotas_enabled
        - targets
        properties:
          object:
            type: string
            description: |
              Object field to distinguish the operation.
            enum:
            - blended
            example: blended
          blended_type:
            type: string
            description: The blended_type field defines the functional behavior of the blended profile as either interlock
              or control. If omitted, the system defaults to interlock. This field distinguishes between profiles requiring
              a full matrix expansion (interlock) and those used for isolating specific demographic segments (control).
            enum:
            - interlock
            - control
            example: interlock
          name:
            type: string
            description: The name of the profile.
            example: SF_YoungAge
          quotas_enabled:
            type: boolean
            description: Flag indicating if quotas are enabled.
            example: true
          targets:
            $ref: '#/components/schemas/RequestDraftQuotaV3'
