        name:
          type: string
          description: The name of the project. Any leading or trailing whitespace will be trimmed.
          minLength: 5
          maxLength: 128
          example: A Project
        project_manager_id:
          type: string
          format: uuid
          example: 96C65204-90C2-4DCB-9393-B8226DD50C76
          description: Project manager ID.
        project_customer_reference_number:
          type: string
          description: A customer-provided reference number assigned to the project.
          minLength: 3
          maxLength: 128
          pattern: ^[a-zA-Z0-9\-_ ]*$
          example: RF-4567
      required:
      - name
      - project_manager_id
    TargetGroupHumanReadableID:
      description: The target group's human-readable ID. This ID is unique within the scope of an account.
      type: string
      minLength: 7
      maxLength: 7
      example: 9NRV3B9
    ProjectInfoUpdate:
      type: object
      description: The request payload for updating an existing project.
      required:
      - name
      - project_manager_id
      - project_customer_reference_number
      properties:
        name:
          type: string
          description: The name of the project. Any leading or trailing whitespace will be trimmed.
          minLength: 5
          maxLength: 128
          example: A Project
        project_manager_id:
          $ref: '#/components/schemas/UserID'
        project_customer_reference_number:
          type: string
          pattern: ^[a-zA-Z0-9\-_ ]*$
          nullable: true
          minLength: 3
          maxLength: 128
          description: |
            A customer-provided reference number assigned to the project.

            :::danger Deletion Warning
            If this field is omitted from the request body during an update, the existing customer reference number will be permanently deleted.
            :::
          example: RF-4567
    ProjectListItem:
      type: object
      description: A single project summary object, typically returned in a list.
      required:
      - id
      - account_id
      - name
      - status
      - last_activity_at
      - target_group_count
      - statistics
      properties:
        id:
          type: string
          pattern: ^[0-9A-Z]{26}$
          description: A unique identifier for the project in ULID format.
          example: 01HD6WD8W4G8FMTFCX0JPR8TXN
        human_readable_id:
          description: The project's human-readable ID, unique within the account.
          $ref: '#/components/schemas/ProjectHumanReadableID'
        account_id:
          description: The unique identifier of the account this project belongs to.
          $ref: '#/components/schemas/AccountID'
        project_customer_reference_number:
          type: string
          description: A customer-provided reference number assigned to the project.
          minLength: 3
          maxLength: 128
          example: RF-4567
        name:
          type: string
          description: The name of the project.
          example: Test Project
        highlighted_name:
          type: string
          description: |
            The name of the project, with parts that matched the search string being highlighted between HTML emphasis tags. If there was no search string, or the search string matched this project based on the identifier (and not based on the name), this property will be omitted.
          example: <em>Test</em> Project
        target_group_human_readable_ids:
          type: array
          description: |
            If the search string matched one or more of the ID's of target groups contained within the project, those target groups will be listed here. If no such matches were found, this property will be omitted.
          items:
            $ref: '#/components/schemas/TargetGroupHumanReadableID'
        target_group_count:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          example: 1
          description: The total number of target groups in this project.
        status:
          description: The current status of the project.
          $ref: '#/components/schemas/ProjectStatus'
        last_activity_at:
          type: string
          format: date-time
          description: The timestamp of the last activity on the project, in ISO 8601 format.
          example: '2023-01-01T23:00:00.000Z'
        statistics:
          description: An object containing key performance statistics for the project.
          $ref: '#/components/schemas/ProjectStatistics'
        target_group_customer_reference_numbers:
          type: array
          description: |
            If the search string matched one or more of the customer reference numbers of target groups contained within the project, those target groups will be listed here. If no such matches were found, this property will be omitted.
          items:
            $ref: '#/components/schemas/TargetGroupCustomerReferenceNumber'
    ProjectOverview:
      type: object
