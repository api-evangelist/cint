                  format: binary
                  description: The file to upload. Must be a plain text or CSV file.
            example:
              file: |
                0F1CE179-A917-49FF-9D50-B05FC91F7BD4
                75F1404C-65F6-4937-AD2A-588E4F66E07F
                9C23131D-388B-4E03-97B3-CF783E491445
      responses:
