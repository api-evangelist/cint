        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    parameters:
    - $ref: '#/components/parameters/AccountID'
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/TargetGroupID'
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
  /demand/accounts/{account_id}/business-units/{business_unit_id}/rate-card:
    get:
      summary: Retrieve a rate card
      description: Rate Cards predefine the prices that a buyer will be charged for sessions on a Target Group that fits the
        equivalent IR and LOI metrics. Buyers can understand the interaction of the active Rate Card on a Target Group with
        the statistics, price changes and available configurations such as maximum prices and price boost via help documents
        and guides. This API allows buyers to look up a Rate Card based on the provided search parameters. The Rate Card is
        returned as a 2D array where each row array is LOI (with the number and value of the rows defined by the length_of_interview_minutes)
        and each column (index within a row array) is IR in percentage with the values defined by the incidence_rate_percents
        field.
      operationId: get_rate_card
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/BusinessUnitID'
      - $ref: '#/components/parameters/CountryCode'
      tags:
      - Target Groups
      responses:
        '200':
          description: Successfully return matching Rate Card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCard'
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    parameters:
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
  /demand/accounts/{account_id}/projects/{project_id}/target-groups/{target_group_id}/rate-card:
    get:
      summary: Retrieve a target group's rate card
      description: Depending on the state of the Target Group, this may be a predicted Rate Card, which may be replaced by
        a new version before the Target Group collects completes or the actual Rate Card which is permanently associated with
        the Target Group. This association is made when the Target Group first goes live. Rate Cards predefine the prices
        that a buyer will be charged for sessions on a Target Group that fits the equivalent IR and LOI metrics. Buyers can
        understand the interaction of the active Rate Card on a Target Group with the statistics, price changes and available
        configurations such as maximum prices and price boost via help documents and guides. The Rate Card is returned as
        a 2D array where each row array is LOI (with the number and value of the rows defined by the length_of_interview_minutes)
        and each column (index within a row array) is IR in percentage with the values defined by the incidence_rate_percents
        field.
      operationId: get_target_group_rate_card
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TargetGroupID'
      tags:
      - Target Groups
      responses:
        '200':
          description: Successfully return matching Rate Card.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PredictedRateCard'
                - $ref: '#/components/schemas/BoundRateCard'
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    parameters:
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
  /demand/accounts/{account_id}/projects/{project_id}/target-groups/{target_group_id}/cost-per-interview:
    put:
      operationId: update_cost_per_interview
      summary: Update target group cost per interview
      description: Updates the cost per interview to the value specified in the request body. The target group cannot be in
        draft state. The Target Group CPI must not exceed the platform limit of $105.00. For non-USD amounts, the CPI is compared
        against the equivalent limit in the provided currency. Note - This limit is subject to platform configuration and
        may change.
      tags:
      - Target Groups
      requestBody:
        description: Cost per interview update request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostPerInterviewUpdateRequest'
      responses:
        '200':
          description: Cost per interview on target group successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostPerInterviewUpdateResponse'
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
