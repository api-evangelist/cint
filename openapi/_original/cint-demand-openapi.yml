      required:
      - job_id
      - created_at
      - created_by
      - status
      - updated_target_groups
      - failed_target_groups
    GetBulkLaunchTargetGroupJobResponse:
      type: object
      description: Bulk launch target groups job details.
      properties:
        job_id:
          $ref: '#/components/schemas/JobID'
        created_at:
          type: string
