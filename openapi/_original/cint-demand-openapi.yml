    ValidateProfilesRequestV3:
      description: The request body for validating a profile configuration.
      type: object
      required:
      - locale
      - completes_goal
      - profiling
      properties:
        locale:
          type: string
          example: eng_us
        completes_goal:
          $ref: '#/components/schemas/CompletesGoal'
        profiling:
          description: The core profiling configuration to be validated.
          type: object
          required:
          - profile_adjustment_type
          - profiles
          properties:
            profile_adjustment_type:
              type: string
              description: Defines how quotas are specified in the `profile` object. Use `percentage` to define quotas as
                a percentage of the `completes_goal`, or `nominal` to define them as a specific number of completes.
              enum:
              - percentage
              - nominal
              example: percentage
            profiles:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/RequestDraftRegularProfileV3'
      example:
        locale: eng_us
        completes_goal: 1000
        profiling:
          profile_adjustment_type: percentage
          profiles:
          - object: regular
            name: GENDER
            quotas_enabled: true
            targets:
            - name: Target-Male
              conditions:
              - object: selection
                question_id: 43
                option: '1'
              quota:
                completes_goal_percentage: 50
            - name: Target-Female
              conditions:
              - object: selection
                question_id: 43
                option: '2'
              quota:
                completes_goal_percentage: 50
          - object: regular
            quotas_enabled: false
            targets:
            - conditions:
              - object: selection
                question_id: 96
                option: '1'
            - conditions:
              - object: selection
                question_id: 96
                option: '10'
            - conditions:
              - object: selection
                question_id: 96
                option: '11'
          - object: blended
            blended_type: control
            name: Control quota
            quotas_enabled: true
            targets:
            - name: Control quota 1
              conditions:
              - object: selection
                question_id: 43
                option: '1'
              - object: range
                question_id: 42
                min: 20
                max: 29
              - object: selection
                question_id: 96
                option: '1'
              quota:
                completes_goal_percentage: 0.0
                completes_goal: 0
                quota_nominal: 0
            - name: Control quota 2
              conditions:
              - object: selection
                question_id: 43
                option: '2'
              - object: range
                question_id: 42
                min: 30
                max: 39
              - object: selection
                question_id: 96
                option: '1'
              quota:
                completes_goal_percentage: 10.0
                completes_goal: 0
                quota_nominal: 0
            - name: Control quota 3
              conditions:
              - object: selection
                question_id: 43
                option: '1'
              - object: range
                question_id: 42
                min: 30
                max: 39
              - object: selection
                question_id: 96
                option: '1'
              quota:
                completes_goal_percentage: 0.0
                completes_goal: 0
                quota_nominal: 0
