    CostPerInterviewUpdateRequest:
      type: object
      description: Cost per interview update request.
      required:
      - target_group_cpi
      properties:
        target_group_cpi:
          $ref: '#/components/schemas/TargetGroupCpiRequestModel'
    TargetGroupTestUrl:
      description: 'The test link into the study that the respondent gets redirected to upon qualification.  Note:  This url
        must be HTTPS.'
      type: string
      example: https://example.com/test
    TargetGroupClientCpiMonetaryAmountRequestModel:
      description: This property can only be defined on a Target Group with dynamic pricing. This property must not be defined
        on Target Groups with rate card pricing.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmountRequestModel'
    TargetGroupStatusChangeReasonCode:
      type: string
      description: The reason code for the status change.
      enum:
      - max_cpi_limit_reached
      - live_respondent_unique_codes_exhausted
      - past_scheduled_end_date
      - total_completes_reached
      - past_soft_launch_end_date
      - no_completes_in_several_days
      - no_completes_after_many_prescreens
      - high_median_loi
      - excessive_redirect_errors
      - excessive_encryption_errors
      - excessive_qualification_setup_errors
      - high_drop_rates
      - low_epc
      - high_client_side_termination_rate
      example: max_cpi_limit_reached
    PacingGeminiExposedTargetGroupId:
      type: string
      format: ulid
      description: A 128 bit ULID. 26 characters, consisting of 10 characters representing the timestamp at the time of creation,
        and 16 characters for randomness.
      example: 01HC2K97AV64A8KSJT7GPH4ZC7
    TargetGroupCpiNote:
      description: CPI note is mainly used for information purposes to track internal margin. This property can only be defined
        on a Target Group with dynamic pricing.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmount'
    TargetGroupScreenerSideReEntryAttribute:
      description: An attribute of the re-entry configuration that applies on the screener side.
      type: object
      required:
      - screener_side
      properties:
        screener_side:
          $ref: '#/components/schemas/TargetGroupReEntryAttributeConfig'
    EarningsPerClick:
      type: object
      description: Current Cost per Interview multiplied by completes so far, divided by the number of entrants.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmount'
    DraftTargetGroupLinks:
      type: object
      properties:
        links:
          type: object
          description: Contains external Target Group related links.
          properties:
            test_client_survey:
              type: string
              format: uri
              example: https://survey.someexamplesurveylink.com/s3/7189709/Example-survey?RID={RID}
              description: The link into the study that the respondent gets redirected to upon qualification.
    ComputeTargetGroupTransitionsRequest:
      type: object
      description: Request body for computing target group transitions.
      properties:
        search_string:
          $ref: '#/components/schemas/TargetGroupSearchString'
        filters:
          $ref: '#/components/schemas/ComputeTargetGroupTransitionsFilters'
        included_target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
        excluded_target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
    PricingAssistance:
      description: Assist the pricing of the target group.
      type: string
      enum:
      - dynamic
      example: dynamic
    ProfilingDraftResponse:
      type: object
      required:
      - profile_adjustment_type
      - profiles
      properties:
        profile_adjustment_type:
          type: string
          description: |
            The method used to specify quota targets. Must be one of:
              - **percentage**: specify a proportion of the total as a decimal with up to two decimal places (e.g. `12.34` for 12.34%).
              - **nominal**: specify an exact number of completes as an integer.
          example: percentage
          enum:
          - percentage
          - nominal
        profiles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DraftRegularProfileV3'
    BoundRateCard:
      type: object
      description: The CPI is derived from the rate card (also known as the pricing table), using the Estimated Length of
        Interview (LOI) and Incidence Rate (IR) of your Target Group. It will include the Initial Volume Discount if your
        Project qualifies for one. This object represents a "bound" rate card, meaning that this is the version of the rate
        card which was active at the time when the Target Group was launched, and which is now permanently associated with
        the Target Group.
      required:
      - country_code
      - bound_rate_card_token
      - bound_rate_card
      properties:
        country_code:
          type: string
          description: String representing the country code.
          example: US
        bound_rate_card_token:
          type: string
          description: Rate card token.
          example: UkNUPUNPVU5UUlk6UkNWPTE2OkNDPVVT
        bound_rate_card:
          $ref: '#/components/schemas/RateCardData'
    TargetGroupOverviewByTargetGroupId:
      type: object
      description: Basic attributes and statistics of a Target Group.
      required:
      - account_id
      - project_id
      - project_name
      - target_group_name
      - project_manager_id
      - progress
      - pricing_model
      - is_pricing_restricted
      - current_cost_per_interview
      - current_cost
      - status
      - country_code
      - language_code
      - conversion_rate
      - drop_off_rate
      - incidence_rate
      - median_length_of_interview_seconds
      - created_at
      properties:
        account_id:
          $ref: '#/components/schemas/AccountID'
        project_id:
          $ref: '#/components/schemas/ProjectID'
        project_name:
          type: string
          description: Name of the Project which contains the Target Group.
          example: Example Project
        target_group_name:
          type: string
          description: Name of the Target Group.
          example: Example Target Group
        human_readable_id:
          $ref: '#/components/schemas/TargetGroupHumanReadableID'
        project_manager_id:
          $ref: '#/components/schemas/UserID'
        progress:
          $ref: '#/components/schemas/TargetGroupProgress'
        pricing_model:
          $ref: '#/components/schemas/TargetGroupPricingModel'
        is_pricing_restricted:
          type: boolean
          description: True when there are target group CPI restrictions in place from fielding assistant, otherwise false.
          example: true
        current_cost_per_interview:
          description: Currently active Cost per Interview for the Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        average_cost_per_interview:
          description: Average Cost per Interview for the Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        current_cost:
          description: The total cost of the completes collected so far in this Target Group.
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
        status:
          $ref: '#/components/schemas/TargetGroupStatus'
        country_code:
          type: string
          description: String representing country code.
          example: US
        language_code:
          type: string
          description: String representing language code.
          example: ENG
        conversion_rate:
          $ref: '#/components/schemas/ConversionRate'
        drop_off_rate:
          $ref: '#/components/schemas/DropOffRate'
        incidence_rate:
          $ref: '#/components/schemas/IncidenceRate'
        median_length_of_interview_seconds:
          $ref: '#/components/schemas/MedianLengthOfInterviewSeconds'
        study_type_code:
          $ref: '#/components/schemas/StudyTypeCode'
        target_group_customer_reference_number:
          allOf:
          - $ref: '#/components/schemas/TargetGroupCustomerReferenceNumber'
          - nullable: true
        created_at:
          type: string
          format: date-time
          description: Date and time when the target group was created (RFC3339 UTC format, 3 fractional digits).
          example: '2023-01-01T23:00:00.000Z'
    TargetGroupClientAndScreenerSideReEntryAttribute:
      description: An attribute of the re-entry configuration that applies on both the client side and screener side.
      type: object
      required:
      - client_side
      - screener_side
      properties:
        client_side:
          $ref: '#/components/schemas/TargetGroupReEntryAttributeConfig'
        screener_side:
          $ref: '#/components/schemas/TargetGroupReEntryAttributeConfig'
    IndustryCodeWithReference:
      type: string
      description: Uniquely identifies the industry with which this Target Group is associated. Get a list of all available
        industries [here](#tag/Definitions/operation/get_industries).
      default: other
      example: politics
    TargetGroupClientCpiMonetaryAmount:
      description: This property can only be defined on a Target Group with dynamic pricing. This property must not be defined
        on Target Groups with rate card pricing.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmount'
    ProfilingDraftRequestWithTemplate:
      type: object
      required:
      - template_id
      - profile_adjustment_type
      - profiles
      properties:
        template_id:
          type: string
          description: "The ID of the profile template. \nIf the template is already applied but the request body has different\
            \ template id \nthen all the profiles associated to previous template will be deleted. \n"
          format: uuid
          example: 9284f2dc-421c-4f4a-ac68-6591c8fa4a38
        profile_adjustment_type:
          type: string
          description: |
            The method used to specify quota targets. Must be one of:
              - **percentage**: specify a proportion of the total as a decimal with up to two decimal places (e.g. `12.34` for 12.34%).
          example: percentage
          enum:
          - percentage
        profiles:
          type: array
          description: "The profiles to be added to the Target Group. \n**Constraint**: If using a template, if any template\
            \ profile shares the same question as \na profile in the profiles array, the profile in the array takes precedence\
            \ over the template profile.\n"
          minItems: 1
          items:
            $ref: '#/components/schemas/RequestDraftRegularProfileV3'
    TargetGroupStatisticsIssueType:
      type: string
      description: The type of issue.
      enum:
      - warning
      - error
      example: warning
    QuotaOverlayAssisted:
      description: Assists the target group with quota overlay functionality.
      type: boolean
      example: true
    ExclusionEntityID:
      type: string
      description: Indicates the entity identifier of the excluded element
      example: 5a3b2ada-0066-4dcb-afdd-7302be78ce9e
    LocaleCodeWithReference:
      type: string
      description: Unique text code of the locale. Get a list of all available locales [here](#tag/Definitions/operation/get_locales).
      example: eng_us
