    EarningsPerClickPerMinute:
      type: object
      description: Earnings per Click divided by median length of interview in minutes.
      allOf:
      - $ref: '#/components/schemas/MonetaryAmount'
    RateCard:
      type: object
      description: The CPI is derived from the rate card (also known as the pricing table), using the Estimated Length of
        Interview (LOI) and Incidence Rate (IR) of your Target Group. It will include the Initial Volume Discount if your
        Project qualifies for one.
      required:
      - country_code
      - token
      - rate_card_data
      properties:
        country_code:
          type: string
          description: String representing the country code.
          example: US
        token:
          type: string
          description: Rate card token.
          example: UkNUPUNPVU5UUlk6UkNWPTE2OkNDPVVT
        rate_card_data:
          $ref: '#/components/schemas/RateCardData'
    FillingStrategyUpdateResponse:
      type: object
      description: Response for filling strategy update.
      required:
      - filling_strategy
      properties:
        filling_strategy:
          $ref: '#/components/schemas/FillingStrategy'
    ProfileTemplateIdWithProfileAdjustmentType:
      type: object
      required:
      - template_id
      - profile_adjustment_type
      properties:
        template_id:
          type: string
          description: "The unique ID of the template. \nThis can be fetched from getProfileTemplate endpoint.\n"
          format: uuid
          example: 9284f2dc-421c-4f4a-ac68-6591c8fa4a38
        profile_adjustment_type:
          type: string
          description: '`percentage` will be the only profile adjustment type supported if template_id is provided.'
          enum:
          - percentage
          example: percentage
    ProfileTemplateId:
      type: object
      properties:
        template_id:
          type: string
          description: "The unique ID of the template. \nThis can be fetched from getProfileTemplate endpoint.\n"
          format: uuid
          example: 9284f2dc-421c-4f4a-ac68-6591c8fa4a38
    TargetGroupReEntryAttributeConfig:
      description: An object that defines whether to allow re-entry for either the current target group, or for other target
        groups in the same project. However, only those other target groups will be considered, which have the "project-level
        exclusion" setting enabled for themselves, and only as long as the current target group also has "project-level exclusion"
        enabled.
      type: object
      required:
      - allow_for_current_target_group
      - allow_for_other_target_groups
      properties:
        allow_for_current_target_group:
          type: boolean
          example: true
        allow_for_other_target_groups:
          type: boolean
          example: true
