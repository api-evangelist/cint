          type: string
          description: The display text for the answer option, in the requested locale.
          example: Condition Text
        text_translated:
          type: string
          description: Translated text of the condition used for display purpose.
          example: Condition Text
        conditions:
          type: array
          description: List of conditions for the quota.
          minItems: 1
          items:
            $ref: '#/components/schemas/InterlockProfileConditionsV3'
    ListQuestionCategories:
      type: object
      description: Lists all available question categories.
      properties:
        categories:
          type: array
          description: List of question categories.
          items:
            $ref: '#/components/schemas/QuestionCategory'
      example:
        categories:
        - id: 23
          code: AIR
          name: Airlines/Travel
    PanelDistributionRequestV3:
      description: The request body for a panel distribution calculation. The `profile_adjustment_type` field (`percentage`
        or `nominal`) determines the structure of the `quota` objects within the `profile`.
      oneOf:
      - title: Profiles populated with percentage as profile adjustment type
        type: object
        required:
        - locale
        - completes_goal
        - profile_adjustment_type
        - start_at
        - end_at
        - profile
        properties:
          locale:
            type: string
            example: eng_us
          completes_goal:
            $ref: '#/components/schemas/CompletesGoal'
          profile_adjustment_type:
            type: string
            description: Defines how quotas are specified in the `profile` object. Use `percentage` to define quotas as a
              percentage of the `completes_goal`, or `nominal` to define them as a specific number of completes.
            enum:
            - percentage
            example: percentage
          start_at:
            type: string
            description: Fielding start date. Start date-time in ISO 8601 format.
            example: 2023-10-09 12:00:00+00:00
          end_at:
            type: string
            description: Fielding end date. End date-time in ISO 8601 format.
            example: 2023-10-23 12:00:00+00:00
          collects_pii:
            type: boolean
            example: false
          profile:
            $ref: '#/components/schemas/RequestDraftRegularProfileV3'
      - title: Profiles populated with nominal as profile adjustment type
        type: object
        required:
        - locale
        - completes_goal
        - profile_adjustment_type
        - start_at
        - end_at
        - profile
        properties:
          locale:
            type: string
            example: eng_us
          completes_goal:
            $ref: '#/components/schemas/CompletesGoal'
          profile_adjustment_type:
            type: string
            description: Defines how quotas are specified in the `profile` object. Use `percentage` to define quotas as a
              percentage of the `completes_goal`, or `nominal` to define them as a specific number of completes.
            enum:
            - nominal
            example: nominal
          start_at:
            type: string
            description: Fielding start date. Start date-time in ISO 8601 format.
            example: 2023-10-09 12:00:00+00:00
          end_at:
            type: string
            description: Fielding end date. End date-time in ISO 8601 format.
            example: 2023-10-23 12:00:00+00:00
          collects_pii:
            type: boolean
            example: false
          profile:
            $ref: '#/components/schemas/RequestDraftRegularProfileV3'
      example:
        locale: eng_us
        completes_goal: 1000
        profile_adjustment_type: percentage
        start_at: '2024-10-09T12:00:00.000Z'
        end_at: '2024-10-23T12:00:00.000Z'
        profile:
          object: regular
          name: Age and Gender
          quotas_enabled: true
          targets:
          - name: Target-Male-18-34
            conditions:
            - object: selection
              question_id: 43
              option: '1'
            - object: range
              question_id: 42
              min: 18
              max: 34
            quota:
              name: Male 18-34
              completes_goal_percentage: 25
    TemplateRegularProfiles:
      type: object
      required:
      - object
      - quotas_enabled
      - targets
      properties:
        object:
          type: string
          description: A field that identifies the profile type. The value is always `regular` for this schema.
          enum:
          - regular
          example: regular
        name:
          type: string
          description: The name of the profile.
          example: Age
        description:
          type: string
          description: A short summary of the profile.
          example: What is your age?
        quotas_enabled:
          type: boolean
          description: Indicates if quotas are enabled for this profile.
          example: true
        targets:
          description: Defines the specific quota targets and their conditions for this profile.
          $ref: '#/components/schemas/TemplatesQuotaV3'
    ProfileTemplateID:
      type: string
      description: A unique identifier for the template.
      format: uuid
      example: 12345678-1234-1234-1234-123456789012
    TemplateQuotaDetailsV3:
      description: |
        Represents a single quota target within a profile template. A target consists of a set of conditions and may or may not have a specific percentage of completes allocated to it. The structure will be one of the following options:
        * An object with a `quota` field for targets with a defined percentage.
        * An object without a `quota` field for targets that are for profiling only.
      oneOf:
      - type: object
        description: A target that defines a set of conditions and the percentage of completes allocated to them
        required:
        - conditions
        - quota
        properties:
          name:
            type: string
            description: The name of the target.
            example: Target Name
          text:
            type: string
            description: The display text for the condition.
            example: Condition Text
          text_translated:
            type: string
            description: Translated text of the condition used for display purpose.
            example: Condition Text
          conditions:
            type: array
            description: List of conditions.
            minItems: 1
            items:
              $ref: '#/components/schemas/InterlockProfileConditionsV3'
          quota:
            type: object
            required:
            - completes_goal_percentage
            properties:
              completes_goal_percentage:
                type: number
                multipleOf: 0.01
                minimum: 0
                maximum: 100
                description: The percentage of the total completes goal that is allocated to this target.
                example: 40
      - title: No quota
        type: object
        description: A target that defines a set of conditions that do not have a specific quota percentage assigned.
        required:
        - conditions
        properties:
          name:
            type: string
            description: The name of the target.
            example: Target Name
          text:
            type: string
            description: The display text for the condition.
            example: Condition Text
          text_translated:
            type: string
            description: Translated text of the condition used for display purpose.
            example: Condition Text
          conditions:
            type: array
            description: List of conditions for the quota.
            minItems: 1
            items:
              $ref: '#/components/schemas/InterlockProfileConditionsV3'
    TemplatesQuotaV3:
      type: array
      description: A list of quota targets for the profile template.
      minItems: 1
      items:
        $ref: '#/components/schemas/TemplateQuotaDetailsV3'
    ProfileTemplateResponse:
      type: object
      description: The response payload for a single, complete profile template, including its overview details and full profiling
        question set.
      allOf:
      - properties:
          id:
            $ref: '#/components/schemas/ProfileTemplateID'
      - $ref: '#/components/schemas/ProfileTemplateOverview'
      - properties:
          profiling:
            $ref: '#/components/schemas/ProfilingTemplate'
    ProfileTemplatesList:
      type: object
      properties:
        templates:
          type: array
          description: A list of profile template summary objects.
          items:
            $ref: '#/components/schemas/ProfileTemplateListItem'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ProfileTemplateListItem:
      type: object
      description: A summary view of a profile template, typically returned in a list. It combines the template's overview
        with its unique `id`.
      allOf:
      - properties:
          id:
            $ref: '#/components/schemas/ProfileTemplateID'
      - $ref: '#/components/schemas/ProfileTemplateOverview'
    ProfileTemplateScopeless:
      type: object
      properties:
        name:
          type: string
          description: A user-defined name for the template.
          example: My Template
        description:
          type: string
          description: A description for the template.
          example: My Template Description
        label:
          type: string
          description: A label for the template.
          example: My Template Label
        locales:
          type: array
          description: A list of locale codes where this template is applicable.
          items:
            $ref: '#/components/schemas/LocaleCode'
    ProfileTemplateOverview:
      description: Represents the overview information for a profile template, combining the base details with its `scope`.
      allOf:
      - $ref: '#/components/schemas/ProfileTemplateScopeless'
      - properties:
          scope:
            type: string
            description: |
              The scope of the profile template, which determines its availability.
              *   `global`: Choose this if you want the template to be available for all accounts.
              *   `account`: Choose this if you want the template to be available only for a specified account.
            enum:
            - global
            - account
            example: global
    ProfileTemplateRequest:
      description: The request payload for creating or updating a profile template.
      allOf:
      - $ref: '#/components/schemas/ProfileTemplateScopeless'
      - properties:
          profiling:
            $ref: '#/components/schemas/ProfilingTemplate'
      - required:
        - name
        - locales
        - label
        - profiling
    ProfilingTemplate:
      type: object
      required:
      - profile_adjustment_type
      - profiles
      properties:
        profile_adjustment_type:
          type: string
          description: The method used to specify quota targets. The only supported value is `percentage`, where you specify
            a proportion of the total completes for each target.
          example: percentage
          enum:
          - percentage
        profiles:
          type: array
          minItems: 1
          description: List of regular profiles.
          items:
            $ref: '#/components/schemas/TemplateRegularProfiles'
    ProjectHumanReadableID:
      description: The project's human-readable ID. This ID is unique within the scope of an account.
      type: string
      minLength: 6
      maxLength: 6
      example: FT354J
    ProjectIDWithHumanReadableIDResponse:
      type: object
      description: The response payload containing a project's `id` and `human_readable_id`.
      properties:
        id:
          $ref: '#/components/schemas/ProjectID'
        human_readable_id:
          $ref: '#/components/schemas/ProjectHumanReadableID'
    ProjectsList:
      type: object
      description: Paginated list of Projects.
      required:
      - projects
      - url
      - has_more
      properties:
        projects:
          type: array
          description: Array of Project list items, representing the results of the query.
          items:
            $ref: '#/components/schemas/ProjectListItem'
        url:
          type: string
          description: URL which produced this list (without query parameters).
          example: /accounts/543587/projects
        has_more:
          type: boolean
          description: If `true`, there are more results to fetch by providing the `next_cursor` in a subsequent request.
            If `false`, you are on the last page of results.
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    ProjectIDResponse:
      type: object
      description: Response containing only the project ID.
      properties:
        id:
          type: string
          format: ulid
          pattern: ^[0-9A-Z]{26}$
          example: 01GV070G3SJECZAGE3Q3J6FV56
    ProjectStatistics:
      type: object
      description: An object containing key performance statistics for a project.
      required:
      - filling_goal
      - current_completes
      - current_prescreens
      - incidence_rate_median
      - length_of_interview_median_seconds
      - conversion_rate_average
      - drop_off_rate_average
      properties:
        filling_goal:
          type: integer
          format: int32
          description: The filling goal indicates the desired total number of completes across all target groups within the
            project.
          minimum: 0
          example: 1000
        current_completes:
          type: integer
          format: int32
          description: Current number of completes for the target groups within the project.
          minimum: 0
          example: 412
        current_prescreens:
          type: integer
          format: int32
          description: Current number of prescreens for the target groups within the project.
          minimum: 0
          example: 546
        incidence_rate_median:
          type: number
          format: float
          description: Current median incidence rate of the target groups within the project.
          minimum: 0
          maximum: 1
          example: 0.05
        length_of_interview_median_seconds:
          type: integer
          format: int32
          description: Current median length of interview of the target groups within the project in seconds.
          minimum: 0
          example: 1
        conversion_rate_average:
          type: number
          format: float
          description: Current average conversion rate of the target groups within the project.
          minimum: 0
          maximum: 1
          example: 0.05
        drop_off_rate_average:
          type: number
          format: float
          description: Current average drop-off rate of the target groups within the project.
          minimum: 0
          maximum: 1
          example: 0.05
    TargetGroupCustomerReferenceNumber:
      type: string
      pattern: ^[a-zA-Z0-9\-_ ]*$
      minLength: 3
      maxLength: 128
      description: A customer-provided reference number for the target group.
      example: AB-00246246
    ProjectStatus:
      type: string
      enum:
      - active
      - inactive
      description: The status of the project.
      example: active
    ProjectInfo:
      type: object
      description: The request payload for creating a new project
