        failed_target_groups:
          $ref: '#/components/schemas/BulkFailedTargetGroups'
      required:
      - job_id
      - created_at
      - created_by
      - status
      - updated_target_groups
      - failed_target_groups
    GetBulkPauseTargetGroupJobResponse:
      type: object
      description: Bulk pause target groups job details.
      properties:
        job_id:
          $ref: '#/components/schemas/JobID'
        created_at:
          type: string
          format: date-time
          example: '2023-01-01T23:00:00.000Z'
        created_by:
          $ref: '#/components/schemas/UserID'
        status:
          $ref: '#/components/schemas/BulkJobStatus'
        updated_target_groups:
          $ref: '#/components/schemas/BulkUpdatedTargetGroups'
        failed_target_groups:
          $ref: '#/components/schemas/BulkFailedTargetGroups'
      required:
      - job_id
      - created_at
      - created_by
      - status
      - updated_target_groups
      - failed_target_groups
    CreateBulkResumeTargetGroupJobRequest:
      type: object
      description: Request body for creating a bulk resume target groups job.
      properties:
        target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
      required:
      - target_group_ids
    BulkJobStatus:
      type: string
      description: The status of an asynchronous bulk job. `Processing` indicates the job is still running. `Completed` or
        `Failed` are terminal states.
      enum:
      - Completed
      - Failed
      - Processing
    GetBulkRelaunchTargetGroupJobResponse:
      type: object
      description: Contains the status and results for a bulk "relaunch" job.
      properties:
        job_id:
          $ref: '#/components/schemas/JobID'
          description: The unique ID of the job.
        created_at:
          type: string
          format: date-time
          description: The date and time when the job was created.
          example: '2023-01-01T23:00:00.000Z'
        created_by:
          $ref: '#/components/schemas/UserID'
        status:
          $ref: '#/components/schemas/BulkJobStatus'
          description: The current status of the job. Poll this endpoint until the status is `Completed` or `Failed`.
        updated_target_groups:
          $ref: '#/components/schemas/BulkUpdatedTargetGroups'
          description: A list of target groups that were successfully relaunched.
        failed_target_groups:
          $ref: '#/components/schemas/BulkFailedTargetGroups'
          description: A list of target groups that could not be relaunched, along with the reason for failure.
      required:
      - job_id
      - created_at
      - created_by
      - status
      - updated_target_groups
      - failed_target_groups
    CreateBulkRelaunchTargetGroupJobRequest:
      type: object
      description: Request body for creating a bulk relaunch target groups job.
      properties:
        target_group_ids:
          $ref: '#/components/schemas/TargetGroupIds'
      required:
      - target_group_ids
    IdempotencyKey:
      type: string
      description: |-
        A shallow unique ID used as part of the deduplication mechanism for mutable operations.
        We suggest using UUIDv4 or another random string with sufficient entropy to avoid collisions.
      maxLength: 255
      example: 01BTGNYV6HRNK8K8VKZASZCFP0
    FieldingRunJobFailureReason:
      type: object
      description: Provides details about why a fielding run job failed.
      required:
      - code
      - description
      properties:
        code:
          type: string
          example: TargetGroupNotFound
        description:
          type: string
          example: Target group not found.
        reasons:
          type: array
          description: Optional. Includes one or more detailed reason objects about the failure, when applicable.
          items:
            $ref: '#/components/schemas/FieldingRunJobFailureReasonDetail'
    FieldingRunJobFailureReasonDetail:
      type: object
      description: Provides granular, machine-readable details for a single validation error.
      properties:
        name:
          description: A machine-readable code for the specific validation error.
          type: string
          example: profile_validation_error_001
        reason:
          description: A machine-readable code providing more context about the validation error.
          type: string
          example: profile_condition_min_greater_than_max_001
        detail:
          description: A human-readable message with specific details about the validation error.
          type: string
          example: QuestionID - 1, Details - Min > Max - 50-40
    FieldingRunStatus:
      description: The current status of a fielding run. A `scheduled` run will become `live` at its start time. A `live`
        run is actively collecting completes.
      type: string
      enum:
      - scheduled
      - live
      - paused
      - completed
    UpdateFieldingRunRequest:
      type: object
      description: Request for updating a fielding run for a given target group id.
      properties:
        start_fielding_at:
          type: string
          format: date-time
          description: The new start time for the fielding run, in RFC3339 UTC format. The start time cannot be in the past.
          example: '2023-01-01T23:00:00.000Z'
        end_fielding_at:
          type: string
          format: date-time
          description: The new end time for the fielding run, in RFC3339 UTC format. The `end_fielding_at` time cannot be
            before the `start_fielding_at` time.
          example: '2023-01-31T23:59:59.000Z'
      required:
      - start_fielding_at
      - end_fielding_at
    FieldingRunItem:
      type: object
      description: The version of the fielding run. This value is used in the `If-Match` header for optimistic locking when
        making updates.
      properties:
        id:
          $ref: '#/components/schemas/FieldingRunID'
        last_changed_at:
          type: string
          format: date-time
          example: '2023-01-01T23:00:00.000Z'
        last_changed_by:
          $ref: '#/components/schemas/UserID'
        start_fielding_at:
          type: string
          format: date-time
          example: '2023-01-01T23:00:00.000Z'
        end_fielding_at:
          type: string
          format: date-time
          example: '2023-01-31T23:59:59.000Z'
        status:
          $ref: '#/components/schemas/FieldingRunStatus'
        version:
          type: integer
          description: Identifies a fielding run version
          example: 5
      required:
      - id
