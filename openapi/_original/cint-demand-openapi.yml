        `filling_goal` has been reached.
      required:
      - current_completes
      - current_prescreens
      - filling_goal
      - filling_strategy
      properties:
        current_completes:
          type: integer
          format: int32
          description: Completes collected in the Target Group so far.
          minimum: 0
          example: 1
        current_prescreens:
          type: integer
          format: int32
          description: Prescreens collected in the Target Group so far.
          minimum: 0
          example: 1
        filling_goal:
          type: integer
          format: int32
          description: The limit of completes or prescreens to be collected in the Target Group.
          minimum: 1
          example: 1
