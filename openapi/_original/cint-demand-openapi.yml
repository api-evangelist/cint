    TargetGroupLanguage:
      name: language
      in: query
      description: Target Group language(s) to match against.
      schema:
        type: array
        items:
          type: string
          pattern: ^[a-z]{3}$
          example: eng
    TargetGroupExclusionStatus:
      name: exclusion_status
      in: query
