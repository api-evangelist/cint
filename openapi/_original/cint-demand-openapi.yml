  /demand/accounts/{account_id}/target-groups/{target_group_id}/respondent-unique-codes/live:
    post:
      operationId: upload_live_respondent_unique_codes
      summary: Upload live respondent unique codes
      description: |
        Uploads a batch of respondent unique codes for a target group. These codes are inserted into the **live URL** for each respondent who enters a survey session.

        :::note URL Setup Required
        Before using this endpoint, you must set up your target group's live URL to include the `[%RESPONDENT_UNIQUE_CODE%]` placeholder.

        *Example live URL setup:*
        `https://example_live_url.com?id=[%RESPONDENT_UNIQUE_CODE%]`
        :::

        ### Processing Rules

        *   **Batch Size**: You can submit a minimum of 1 and a maximum of 20,000 codes in a single request.
        *   **Code Format**: Codes must be between 1 and 128 characters and contain only alphanumeric characters, hyphens (`-`), and underscores (`_`). Leading and trailing whitespace will be removed.
        *   **Uniqueness**: Only unique codes are processed.
            *   If you include duplicates within a single batch, only the first occurrence is considered.
            *   If you upload codes that already exist for this target group's live URL, they will be ignored.

        :::caution Feature Access
        This feature must be enabled for your account. If it's not enabled, this endpoint will return a `403 Forbidden` error. Please contact your account manager for more information.
        :::
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/TargetGroupID'
      - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
      tags:
      - Respondent Unique Codes
      requestBody:
        description: The list of live respondent unique codes to upload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadLiveRespondentUniqueCodesRequest'
            example:
              respondent_unique_codes:
              - abc-123-xyz-789
              - def-456-uvw-123
              - ghi-789-rst-456
      responses:
        '200':
          description: Returns a summary of the upload operation, including the number of new codes that were successfully
            added. Codes that were duplicates or already existed are ignored and not counted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadLiveRespondentUniqueCodesResponse'
              example:
                uploaded_count: 3
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '429':
          $ref: '#/components/responses/Error_RateLimit'
        '500':
          $ref: '#/components/responses/Error_Internal'
  /demand/accounts/{account_id}/target-groups/{target_group_id}/respondent-unique-codes/live/stats:
    get:
      operationId: get_live_respondent_unique_codes_stats
      summary: Get live respondent unique code stats
      description: |
        This endpoint returns a summary of the usage for live respondent unique codes for a specific target group. The response includes the total number of codes stored and the count of those that remain unconsumed.

        :::caution Feature Access
        This feature must be enabled for your account. If it's not enabled, this endpoint will return a `403 Forbidden` error. Please contact your account manager for more information.
        :::
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/TargetGroupID'
      - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
      tags:
      - Respondent Unique Codes
      responses:
        '200':
          description: Returns the total and unconsumed counts of live respondent unique codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLiveRespondentUniqueCodesStatsResponse'
              example:
                total_count: 1500
                unconsumed_count: 850
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '429':
          $ref: '#/components/responses/Error_RateLimit'
        '500':
          $ref: '#/components/responses/Error_Internal'
  /demand/accounts/{account_id}/target-groups/{target_group_id}/respondent-unique-codes/live/unconsumed:
    delete:
      operationId: delete_unconsumed_live_respondent_unique_codes
      summary: Delete all unconsumed live respondent unique codes
      description: |
        This endpoint permanently deletes all unconsumed **live** respondent unique codes for a specific target group.

