        '500':
          $ref: '#/components/responses/Error_Internal'
    put:
      operationId: set_target_group_respondent_activity_exclusions
      summary: Set the respondent activity exclusions for a target group
      description: "Set the list of target groups and/or projects whose respondents you want to exclude from the specified\
        \ `target_group_id`. \n\nThe request body specifies the projects and target groups whose respondent activity should\
        \ be excluded from the target group identified in the path.\nEach exclusion item can optionally specify a `duration`\
        \ (ISO-8601 period format, date-based only, e.g. `P90D` for 90 days) controlling how far back to look for respondent\
        \ activity. Must be between 1 and 396 days. A `duration` can also be set at the request root level to apply as the\
        \ default for all items. Per-item durations override the request-level default. If neither is specified, the duration\
        \ defaults to P90D (90 days).\nExclusions apply when there are completes within each exclusion item's configured `duration`.\
        \ The request must not include the same target group specified in the path parameters, nor the project it belongs\
        \ to, as a target group cannot exclude its own respondent activity or that of its parent project.\n\n:::important\n\
        This operation will overwrite any previous existing list. Make sure to include previously saved target groups or projects\
        \ in your request.\nIf the Target Group is already live, updating its respondent activity exclusions will only affect\
        \ future respondent traffic. Any respondents who have already entered or completed the Target Group under the previous\
        \ exclusion settings cannot be retroactively changed. Please review your changes carefully before switching the target\
        \ group to live.\n:::\n"
      tags:
      - Respondent Exclusions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRespondentActivityExclusionsRequest'
      responses:
        '204':
          description: Successfully updated respondent activity exclusions.
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '500':
          $ref: '#/components/responses/Error_Internal'
