  /demand/accounts/{account_id}/projects/{project_id}/target-groups/{target_group_id}/calculate-feasibility:
    post:
      operationId: calculate_target_group_feasibility_by_id
      summary: Calculates feasibility for a non-draft target group
      description: |-
        Calculates feasibility information based on the current state of the target group.
        The request properties are all optional. They serve as a way of performing what-if analysis on the Target Group. When a property is provided in the request, the feasibility analysis will behave as if the relevant property on the target group had the value which was sent in the request body. Any number of properties can be provided for what-if analysis this way. However, it should be kept in mind that the analysis is still performed on _the current target group_, therefore it will be influenced by factors such as the number of completes collected so far, the exchange rate of the target group's currency versus USD when it went live, etc.
        **Note:** Profiles with a large number of open-ended values or complex condition groups may result in reduced feasibility accuracy or a zero feasibility value. We recommend reviewing the suggested price carefully and running your own sample to validate the results.
      tags:
      - Feasibility
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/TargetGroupID'
      - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
      requestBody:
        required: false
        description: Optionally provides a means of overriding Target Group details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateTargetGroupFeasibilityByIdRequest'
      responses:
        '200':
          description: Successfully obtained target group feasibility.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateTargetGroupFeasibilityResponse'
          headers:
            traceparent:
              description: The `traceparent` header carries the trace ID and parent span ID, as defined by the W3C Trace Context
                specification. It's used to trace a single request as it moves through multiple services.
              required: false
              schema: *id001
            tracestate:
              description: The `tracestate` header complements the `traceparent` header by carrying vendor-specific trace
                information. This allows different services to add their own data to a trace.
              required: false
              schema: *id002
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '422':
          $ref: '#/components/responses/Error_InvalidState'
        '500':
          $ref: '#/components/responses/Error_Internal'
  /demand/accounts/{account_id}/projects/{project_id}/target-groups/{target_group_id}/fielding-assistant-assignment:
    get:
      operationId: get_fielding_assistant_assignment
      summary: Retrieves the Fielding Assistant assignment for a target group
      description: |-
        Retrieves the current Fielding Assistant configuration for a target group. The response will show which modules, if any, are currently enabled. Examples:

          * Pricing
          * Quota overlay
          * Pacing
          * Soft launch
      tags:
      - Fielding Assistant
      responses:
        '200':
          description: The Fielding Assistant assignment details were retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldingAssistantModulesAssignment'
              example:
                pricing:
                  type: dynamic
                  maximum_cpi":
                    value: '5.00'
                    currency_code: USD
                    currency_scale: 2
                pacing:
                  type: linear
                  increment_interval: P1D
                quota_overlay:
                  prevent_overfill": true
                  balance_fill: true
                soft_launch: null
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    put:
      operationId: create_or_update_fielding_assistant_assignment
      summary: Create or update the Fielding Assistant assignment
      description: |
        Creates or fully replaces the Fielding Assistant assignment for a target group. This is an "all or nothing" operation.
        To modify an existing assignment, you must first GET the current configuration, make your changes,
        and then PUT the entire modified object back. Sending a request with only one module will disable all others.
        To disable all modules, send an empty object `{}`. This endpoint uses the `If-Match` header for optimistic locking.
      tags:
      - Fielding Assistant
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        description: Fielding assistant assignment request.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldingAssistantModulesAssignmentRequestModel'
            examples:
              full_configuration:
                summary: Enable Dynamic Pricing and Linear Pacing
                description: Example configuration with dynamic pricing, linear pacing, and quota overlay modules enabled
                value:
                  pricing:
                    type: dynamic
                    maximum_cpi:
                      value: '5.00'
                      currency_code: USD
                  pacing:
                    type: linear
                    increment_interval: P1D
                  quota_overlay:
                    prevent_overfill: true
                    balance_fill: true
              disable_all:
                summary: Disable All Modules
                description: Send an empty object to disable all Fielding Assistant modules
                value: {}
      responses:
        '204':
          description: Fielding assistant assignment on target group successfully created or updated.
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '412':
          $ref: '#/components/responses/Precondition_Failed'
        '500':
          $ref: '#/components/responses/Error_Internal'
    parameters:
    - $ref: '#/components/parameters/AccountID'
    - $ref: '#/components/parameters/ProjectID'
    - $ref: '#/components/parameters/TargetGroupID'
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
  /demand/accounts/{account_id}/projects/{project_id}/batch-jobs/complete-fielding-runs-by-target-group-id:
    post:
      summary: Creates a job to complete multiple target groups
      description: "This endpoint creates a bulk job to complete fielding runs for a list of specified target group IDs. This\
        \ action will immediately complete the \nspecified target groups, regardless of whether their completes goals or end\
        \ dates have been reached.\nIf a target group is already completed, the system considers the action successful.\n\n\
        To ensure that the same job is not created multiple times, this endpoint uses an `Idempotency-Key` from the request\
        \ header. If a job with \nthe same key has already been submitted, the system will not create a new one but will treat\
        \ the operation as successful and \nreturn the same successful response as for a newly created job.\n\nUpon successful\
        \ submission, the system creates a new bulk job to start the actual processing asynchronously. This means \nthe endpoint\
        \ returns a response quickly without waiting for the entire bulk operation to complete. If the job is created successfully\
        \ or if \nit already existed due to the idempotency key, the endpoint returns a `201 Created` status code with the\
        \ job ID in the `Location` header.\n\nTo check the status of the job, you can use the job ID returned in the `Location`\
        \ header with the `Retrieve a bulk job status` endpoint.\nThe processing of the job will continue even if an operation\
        \ on an individual target group fails. The final job status will list which target groups \nwere updated successfully\
        \ and which ones failed.\n"
      operationId: create_bulk_complete_target_groups_job
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        description: A list of target group IDs to be completed.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkCompleteTargetGroupJobRequest'
            example:
              target_group_ids:
              - 01BTGNYV6HRNK8K8VKZASZCFP1
              - 01BTGNYV6HRNK8K8VKZASZCFP2
      tags:
      - Fielding (Batch)
      responses:
        '201':
          description: The job was created successfully. Poll the URL in the `Location` header to track its status.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            tracestate:
              $ref: '#/components/headers/Tracestate'
            location:
              $ref: '#/components/headers/Location'
              example: /demand/accounts/101/projects/01BTGNYV6HRNK8K8VKZASZCFP0/batch-jobs/complete/01BTGNYV6HRNK8K8VKZASZCFP1
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    parameters:
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
  /demand/accounts/{account_id}/projects/{project_id}/batch-jobs/complete-fielding-runs-by-target-group-id/{job_id}:
    get:
      summary: Retrieves a bulk "complete" job status
      description: |
        This endpoint retrieves the status and details of a previously created bulk-complete job using its job ID.

        You should poll this endpoint periodically until the `status` field is either `Completed` or `Failed`. If the status is `Processing`, the job is still running.
        Once the job is finished, the `updated_target_groups` and `failed_target_groups` lists will show the outcome for each target group included in the original request.
        If a target group was already in the desired status, it will be included in the `updated_target_groups` list, even though no change was made.
      operationId: get_bulk_complete_target_groups_job
      parameters:
      - $ref: '#/components/parameters/AccountID'
      - $ref: '#/components/parameters/ProjectID'
      - $ref: '#/components/parameters/JobID'
      tags:
      - Fielding (Batch)
      responses:
        '200':
          description: The bulk "complete" job details were retrieved successfully.
          headers:
            traceparent:
              $ref: '#/components/headers/Traceparent'
            tracestate:
              $ref: '#/components/headers/Tracestate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBulkCompleteTargetGroupJobResponse'
              example:
                job_id: 01BTGNYV6HRNK8K8VKZASZCFP1
                created_at: '2023-01-01T23:00:00.000Z'
                created_by: b551326b-ac9d-4d32-8823-4f025787dab9
                status: Completed
                updated_target_groups:
                  data:
                  - target_group_id: 01BTGNYV6HRNK8K8VKZASZCFP2
                  has_more: false
                failed_target_groups:
                  data:
                  - target_group_id: 01BTGNYV6HRNK8K8VKZASZCFP3
                    failure_reason:
                      code: StatusTransitionNotAllowed
                      description: Status transition is not allowed.
                  has_more: false
        '400':
          $ref: '#/components/responses/Error_BadRequest'
        '401':
          $ref: '#/components/responses/Error_Unauthorized'
        '403':
          $ref: '#/components/responses/Error_Forbidden'
        '404':
          $ref: '#/components/responses/Error_NotFound'
        '500':
          $ref: '#/components/responses/Error_Internal'
    parameters:
    - $ref: '#/components/parameters/CintAPIVersion-2025-12-18'
